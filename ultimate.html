<html lang="en">

<meta charset="UTF-8" />

<title>The Ultimate Ranking</title>
<style>
  html, body { margin:0; padding:0; background:#ffffff; }
  * { box-sizing: border-box; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; color:#151515; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 2.25rem 1.1rem 3.5rem; }

  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight:400; font-size: 32px; letter-spacing:-0.01em; margin:0 0 6px; }
  .dek { font-size: 14px; color:#5c5c58; max-width: 60ch; line-height:1.5; margin-bottom: 22px; }

  .legend { display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:#5c5c58; margin-bottom:22px; padding-bottom:16px; border-bottom:1px solid #e5e5e0; }
  .legend span.dot { display:inline-block; width:9px; height:9px; margin-right:6px; border-radius:1px; position:relative; top:1px; }

  .weights { border:1px solid #e5e5e0; padding:16px 18px; margin-bottom:22px; }
  .weights h2 { font-family: Georgia, serif; font-weight:400; font-size:14px; margin:0 0 12px; color:#151515; }
  .weight-row { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .weight-row:last-child { margin-bottom:0; }
  .weight-row label { width:78px; font-size:12.5px; flex-shrink:0; }
  .weight-row input[type=range] { flex:1; accent-color:#151515; }
  .weight-row .pct { width:38px; text-align:right; font-variant-numeric: tabular-nums; font-size:12.5px; color:#5c5c58; }
  .weights .reset { margin-top:12px; font-size:11.5px; color:#5c5c58; background:none; border:none; text-decoration:underline; cursor:pointer; padding:0; }

  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  input[type=text] { flex:1 1 180px; padding:8px 10px; border:1px solid #cfcfc9; font-size:14px; font-family:inherit; }
  select { padding:8px 10px; border:1px solid #cfcfc9; font-size:13px; font-family:inherit; background:#fff; }
  .toggle-group { display:flex; border:1px solid #151515; }
  .toggle-group button { padding:8px 11px; font-size:12px; border:none; background:#fff; cursor:pointer; border-left:1px solid #151515; white-space:nowrap; }
  .toggle-group button:first-child { border-left:none; }
  .toggle-group button.active { background:#151515; color:#fff; }

  .status { font-size:12.5px; color:#5c5c58; margin-bottom:14px; }
  .status.warn { color:#9a5a10; }

  .row { border-bottom:1px solid #e5e5e0; padding:13px 0; cursor:pointer; }
  .row-top { display:flex; align-items:center; gap:12px; }
  .rank { font-family: monospace; font-size:12px; color:#a3a39c; width:22px; flex-shrink:0; }
  .name-block { flex:1; min-width:0; }
  .name-line { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .country-name { font-family: Georgia, serif; font-size:16.5px; }
  .continent-tag { font-size:10.5px; color:#a3a39c; margin-left:6px; }
  .overall-num { font-family: monospace; font-size:14px; white-space:nowrap; }

  .segbar { height:7px; background:#f0f0ec; margin-top:7px; display:flex; overflow:hidden; }
  .segbar > div { height:100%; }
  .seg-desire { background:#a67c1b; }
  .seg-safety { background:#1f4b3f; }
  .seg-ethics { background:#2c3e63; }

  .meta-line { font-size:11px; color:#a3a39c; margin-top:5px; display:flex; gap:10px; flex-wrap:wrap; }
  .flag { display:inline-block; font-size:9px; padding:1px 4px; border-radius:2px; border:1px solid; }
  .flag.severe { background:#b23b3b; border-color:#b23b3b; color:#fff; }
  .flag.mid { background:#fbf1de; border-color:#a67c1b; color:#7a5a10; }

  .detail { padding: 4px 0 4px 34px; }
  .detail .subrow { display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; border-bottom:1px solid #f2f2ee; }
  .detail .subrow .subval { font-family:monospace; color:#5c5c58; }
  .detail .landmarks { margin-top:8px; }
  .detail .landmark-item { display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; color:#5c5c58; }
  .detail .landmark-item.visited { text-decoration:line-through; opacity:0.55; }
  .empty { text-align:center; color:#a3a39c; padding:2.5rem 0; font-size:13.5px; line-height:1.6; }
  .footnote { font-size:10.5px; color:#a3a39c; margin-top:26px; line-height:1.6; }
</style>

const STORAGE_KEY = "bucket-list:data";

/* ---------- helpers ---------- */
const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

function safetyEthics(d) {
  let gpiScore = null;
  if (d.gpi != null) {
    const clamped = Math.max(1.1, Math.min(3.4, d.gpi));
    gpiScore = 100 - ((clamped - 1.1) / (3.4 - 1.1)) * 100;
  }
  let wpsScore = d.wps != null ? d.wps * 100 : null;

  let penalty = 0;
  if (d.us === 'L4') penalty += 35;
  else if (d.us === 'L3') penalty += 14;
  if (d.uk === 'ALL') penalty += 25;
  else if (d.uk === 'ESS') penalty += 10;
  if (d.es === 'ALL') penalty += 20;

  let base = null, weightSum = 0, weighted = 0;
  if (gpiScore != null) { weighted += gpiScore * 0.55; weightSum += 0.55; }
  if (wpsScore != null) { weighted += wpsScore * 0.45; weightSum += 0.45; }
  if (weightSum > 0) base = weighted / weightSum;

  let safety = base != null ? Math.max(0, base - penalty) : (penalty > 0 ? Math.max(0, 45 - penalty) : null);
  let ethics = d.fh != null ? d.fh : null;
  return { safety, ethics, penalty };
}

function advisoryFlags(d) {
  const wrap = el('span', {});
  if (d.us === 'L4') wrap.appendChild(el('span',{class:'flag severe'},'US L4'));
  else if (d.us === 'L3') wrap.appendChild(el('span',{class:'flag mid'},'US L3'));
  if (d.uk === 'ALL') wrap.appendChild(el('span',{class:'flag severe'},'UK advise against'));
  else if (d.uk === 'ESS') wrap.appendChild(el('span',{class:'flag mid'},'UK partial'));
  if (d.es === 'ALL') wrap.appendChild(el('span',{class:'flag severe'},'ES advisory'));
  return wrap;
}

/* ---------- state ---------- */
let bucket = {};
let bucketLoaded = false;
let bucketError = false;

let state = {
  search: '',
  continent: 'All',
  scope: 'mine',       // 'mine' | 'all'
  wDesire: 40,
  wSafety: 35,
  wEthics: 25,
};

async function loadBucket() {
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    bucket = res ? JSON.parse(res.value) : {};
  } catch (e) {
    bucket = {};
  }
  bucketLoaded = true;
  render();
}

function computeDesire() {
  const raw = {};
  Object.entries(bucket).forEach(([name, entry]) => {
    const landmarks = entry.landmarks || [];
    const active = landmarks.filter(l => !l.visited);
    raw[name] = {
      score: active.reduce((s, l) => s + l.rating, 0),
      total: landmarks.length,
      visited: landmarks.length - active.length,
      landmarks,
    };
  });
  return raw;
}

function computeRows() {
  const desireRaw = computeDesire();
  const maxDesireScore = Math.max(1, ...Object.values(desireRaw).map(d => d.score));

  const names = state.scope === 'mine'
    ? Object.keys(bucket)
    : Object.keys(DATA);

  return names.map(name => {
    const d = DATA[name] || { continent: 'Other' };
    const { safety, ethics } = safetyEthics(d);
    const bl = desireRaw[name];
    const desire = bl ? (bl.score / maxDesireScore) * 100 : (state.scope === 'mine' ? null : 0);

    const parts = [];
    if (desire != null) parts.push([desire, state.wDesire]);
    if (safety != null) parts.push([safety, state.wSafety]);
    if (ethics != null) parts.push([ethics, state.wEthics]);
    const wsum = parts.reduce((s, p) => s + p[1], 0);
    const overall = wsum > 0 ? parts.reduce((s, p) => s + p[0] * p[1], 0) / wsum : null;

    return {
      name, continent: d.continent || 'Other',
      safety, ethics, desire, overall,
      d, bl,
    };
  });
}

/* ---------- render ---------- */
let expanded = {};

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const wrap = el('div', { class: 'wrap' });

  wrap.appendChild(el('h1', {}, 'The Ultimate Ranking'));
  wrap.appendChild(el('p', { class: 'dek' },
    'Where you want to go, weighed against how safe it is to go there. Desire comes from your bucket list; safety and ethics come from the country dataset.'));

  const legend = el('div', { class: 'legend' },
    el('span', {}, el('span', { class: 'dot', style: 'background:#a67c1b' }), 'Desire'),
    el('span', {}, el('span', { class: 'dot', style: 'background:#1f4b3f' }), 'Safety'),
    el('span', {}, el('span', { class: 'dot', style: 'background:#2c3e63' }), 'Ethics'),
  );
  wrap.appendChild(legend);

  // weights panel
  const wpanel = el('div', { class: 'weights' });
  wpanel.appendChild(el('h2', {}, 'How much each factor counts'));
  const mkSlider = (label, key) => {
    const row = el('div', { class: 'weight-row' });
    row.appendChild(el('label', {}, label));
    const range = el('input', { type: 'range', min: '0', max: '100', value: String(state[key]) });
    range.addEventListener('input', e => { state[key] = Number(e.target.value); render(); });
    row.appendChild(range);
    const total = state.wDesire + state.wSafety + state.wEthics || 1;
    row.appendChild(el('span', { class: 'pct' }, Math.round((state[key] / total) * 100) + '%'));
    return row;
  };
  wpanel.appendChild(mkSlider('Desire', 'wDesire'));
  wpanel.appendChild(mkSlider('Safety', 'wSafety'));
  wpanel.appendChild(mkSlider('Ethics', 'wEthics'));
  const resetBtn = el('button', { class: 'reset', onclick: () => { state.wDesire = 40; state.wSafety = 35; state.wEthics = 25; render(); } }, 'Reset weights');
  wpanel.appendChild(resetBtn);
  wrap.appendChild(wpanel);

  // controls
  const controls = el('div', { class: 'controls' });
  const search = el('input', { type: 'text', placeholder: 'Search country...', value: state.search, oninput: e => { state.search = e.target.value; render(); } });
  controls.appendChild(search);

  const contSel = el('select', { onchange: e => { state.continent = e.target.value; render(); } });
  ['All', 'Africa', 'Americas', 'Asia', 'Europe', 'Oceania', 'Other'].forEach(c => {
    contSel.appendChild(el('option', { value: c, ...(state.continent === c ? { selected: 'selected' } : {}) }, c));
  });
  controls.appendChild(contSel);

  const toggle = el('div', { class: 'toggle-group' });
  toggle.appendChild(el('button', { class: state.scope === 'mine' ? 'active' : '', onclick: () => { state.scope = 'mine'; render(); } }, 'My list'));
  toggle.appendChild(el('button', { class: state.scope === 'all' ? 'active' : '', onclick: () => { state.scope = 'all'; render(); } }, 'All countries'));
  controls.appendChild(toggle);
  wrap.appendChild(controls);

  if (bucketError) {
    wrap.appendChild(el('div', { class: 'status warn' }, "Couldn't read your bucket list — showing safety and ethics only."));
  } else if (state.scope === 'mine' && Object.keys(bucket).length === 0) {
    wrap.appendChild(el('div', { class: 'empty' },
      'Your bucket list is empty, so there\u2019s nothing to rank yet.',
      el('br'), 'Add countries and places in the Bucket List tool, then come back here \u2014 or switch to "All countries" to rank purely on safety and ethics.'));
    root.appendChild(wrap);
    return;
  }

  let rows = computeRows().filter(r => {
    if (state.continent !== 'All' && r.continent !== state.continent) return false;
    if (state.search && !r.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    return true;
  });

  rows.sort((a, b) => {
    if (a.overall == null && b.overall == null) return a.name.localeCompare(b.name);
    if (a.overall == null) return 1;
    if (b.overall == null) return -1;
    return b.overall - a.overall;
  });

  if (rows.length === 0) {
    wrap.appendChild(el('div', { class: 'empty' }, 'No matches.'));
    root.appendChild(wrap);
    return;
  }

  const list = el('div', {});
  rows.forEach((r, i) => {
    const row = el('div', { class: 'row', onclick: () => { expanded[r.name] = !expanded[r.name]; render(); } });
    const top = el('div', { class: 'row-top' });
    top.appendChild(el('span', { class: 'rank' }, String(i + 1).padStart(2, '0')));
    const nameBlock = el('div', { class: 'name-block' });
    const nameLine = el('div', { class: 'name-line' });
    nameLine.appendChild(el('span', {}, el('span', { class: 'country-name' }, r.name), el('span', { class: 'continent-tag' }, r.continent)));
    nameLine.appendChild(el('span', { class: 'overall-num' }, r.overall != null ? Math.round(r.overall) : '\u2014'));
    nameBlock.appendChild(nameLine);

    const seg = el('div', { class: 'segbar' });
    const total = (r.desire || 0) * state.wDesire + (r.safety || 0) * state.wSafety + (r.ethics || 0) * state.wEthics || 1;
    if (r.desire != null) seg.appendChild(el('div', { class: 'seg-desire', style: `width:${(r.desire * state.wDesire / total) * 100}%` }));
    if (r.safety != null) seg.appendChild(el('div', { class: 'seg-safety', style: `width:${(r.safety * state.wSafety / total) * 100}%` }));
    if (r.ethics != null) seg.appendChild(el('div', { class: 'seg-ethics', style: `width:${(r.ethics * state.wEthics / total) * 100}%` }));
    nameBlock.appendChild(seg);

    const meta = el('div', { class: 'meta-line' });
    if (r.bl) meta.appendChild(el('span', {}, `${r.bl.total} place${r.bl.total === 1 ? '' : 's'} on your list`));
    meta.appendChild(advisoryFlags(r.d));
    nameBlock.appendChild(meta);

    top.appendChild(nameBlock);
    row.appendChild(top);

    if (expanded[r.name]) {
      const detail = el('div', { class: 'detail' });
      detail.appendChild(el('div', { class: 'subrow' }, el('span', {}, 'Desire'), el('span', { class: 'subval' }, r.desire != null ? Math.round(r.desire) : '\u2014')));
      detail.appendChild(el('div', { class: 'subrow' }, el('span', {}, 'Safety'), el('span', { class: 'subval' }, r.safety != null ? Math.round(r.safety) : '\u2014')));
      detail.appendChild(el('div', { class: 'subrow' }, el('span', {}, 'Ethics (Freedom House)'), el('span', { class: 'subval' }, r.ethics != null ? Math.round(r.ethics) : '\u2014')));
      if (r.bl && r.bl.landmarks.length) {
        const lm = el('div', { class: 'landmarks' });
        r.bl.landmarks.slice().sort((a, b) => b.rating - a.rating).forEach(l => {
          lm.appendChild(el('div', { class: 'landmark-item' + (l.visited ? ' visited' : '') },
            el('span', {}, l.name), el('span', {}, '\u2605'.repeat(l.rating))));
        });
        detail.appendChild(lm);
      }
      row.appendChild(detail);
    }
    list.appendChild(row);
  });
  wrap.appendChild(list);

  wrap.appendChild(el('div', { class: 'footnote' },
    'Desire = your bucket-list ratings, normalized against your highest-scoring country. Safety = Global Peace Index + Women, Peace & Security Index, minus US/UK/Spain advisory penalties. Ethics = Freedom House score. Adjust the sliders above to change how much each counts toward the overall rank. Static snapshot \u2014 re-check official advisories before travel.'));

  root.appendChild(wrap);
}

loadBucket();
</script>
</body>
</html>
