<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Travel Bucket List — Final Ranking</title>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  * { box-sizing: border-box; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; color:#111; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 2rem 1.1rem 3rem; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight:400; font-size: 30px; letter-spacing:-0.02em; margin:0 0 4px; }
  .asof { font-size:11.5px; color:#999; margin-bottom:10px; line-height:1.5; }
  .nav { font-size:12.5px; margin-bottom:20px; display:flex; gap:16px; }
  .nav a { color:#111; text-decoration:none; border-bottom:1px solid #111; }
  .nav a:hover { opacity:0.6; }

  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:22px; padding:12px 0; border-top:1px solid #eee; border-bottom:1px solid #eee; }
  input[type=text] { flex:1 1 180px; padding:8px 10px; border:1px solid #ccc; font-size:14px; font-family:inherit; outline:none; }
  .sort-group { display:flex; border:1px solid #111; }
  .sort-group button { padding:8px 11px; font-size:12px; border:none; background:#fff; cursor:pointer; border-left:1px solid #111; white-space:nowrap; }
  .sort-group button:first-child { border-left:none; }
  .sort-group button.active { background:#111; color:#fff; }
  .checkbox-label { display:flex; align-items:center; gap:6px; font-size:12px; color:#555; cursor:pointer; white-space:nowrap; }

  .tier-section { margin-bottom: 28px; }
  .tier-head { display:flex; align-items:center; gap:8px; border-bottom:2px solid #111; padding-bottom:7px; margin-bottom:2px; }
  .tier-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .tier-title { font-family: Georgia, serif; font-size:15px; text-transform:uppercase; letter-spacing:0.06em; }
  .tier-count { margin-left:auto; font-size:11.5px; color:#999; font-family: monospace; }

  .row { border-bottom:1px solid #eee; }
  .row-head { display:flex; align-items:center; gap:10px; padding:11px 0; cursor:pointer; }
  .rank { font-family: monospace; font-size:12px; color:#bbb; width:18px; flex-shrink:0; }
  .chevron { flex-shrink:0; color:#888; font-size:11px; width:10px; }
  .row-main { flex:1; min-width:0; }
  .row-title-line { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .country-name { font-family: Georgia, serif; font-size:16.5px; }
  .continent-tag { font-size:10px; color:#999; margin-left:6px; }
  .stat-cluster { display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .stat { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
  .stat-label { font-size:9px; text-transform:uppercase; letter-spacing:0.05em; color:#aaa; }
  .stat-value { font-family: monospace; font-size:13px; }
  .interest-badge { font-family: monospace; font-size:15px; font-weight:700; background:#111; color:#fff; padding:2px 8px; border-radius:2px; min-width:28px; text-align:center; }
  .mini-bar { height:5px; width:36px; background:#eee; margin-top:2px; }
  .mini-bar > div { height:100%; background:#999; }
  .places-count { font-size:11px; color:#999; margin-top:3px; }
  .na { color:#ccc; }

  .landmarks { padding: 2px 0 14px 28px; }
  .landmark-row { display:flex; align-items:center; gap:9px; padding:5px 0; border-bottom:1px solid #f5f5f5; font-size:13.5px; }
  .landmark-row.visited { opacity:0.4; text-decoration: line-through; }
  .cat-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; border:1px solid #ddd; }
  .landmark-name { flex:1; }
  .rating-dots { display:flex; gap:2px; flex-shrink:0; }
  .rating-dots span { width:9px; height:9px; border:1px solid #111; }
  .rating-dots span.on { background:#111; }
  .no-landmarks { font-size:12.5px; color:#bbb; font-style:italic; padding:6px 0 12px; }
  .edit-hint { font-size:11px; color:#bbb; padding-bottom:6px; }

  .empty { text-align:center; color:#999; padding:2.5rem 0; font-size:13.5px; }
  .footnote { font-size:10.5px; color:#aaa; margin-top:24px; line-height:1.6; }

  @media (max-width: 620px) {
    .stat-cluster { gap:9px; }
    .stat-label { display:none; }
    .continent-tag { display:block; margin-left:0; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script>
/* ---------------------------------------------------------------------
   window.storage shim — identical to the one in index.html, so this
   page reads the SAME bucket-list data that page writes. In a real
   Claude.ai artifact environment, window.storage already exists and
   this shim is skipped.
--------------------------------------------------------------------- */
window.storage = window.storage || {
  async get(key, shared = false) {
    const raw = localStorage.getItem((shared ? "shared:" : "personal:") + key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared };
  },
  async set(key, value, shared = false) {
    localStorage.setItem((shared ? "shared:" : "personal:") + key, value);
    return { key, value, shared };
  },
  async delete(key, shared = false) {
    localStorage.removeItem((shared ? "shared:" : "personal:") + key);
    return { key, deleted: true, shared };
  },
  async list(prefix = "", shared = false) {
    const scope = shared ? "shared:" : "personal:";
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(scope) && k.slice(scope.length).startsWith(prefix)) {
        keys.push(k.slice(scope.length));
      }
    }
    return { keys, prefix, shared };
  },
};

const STORAGE_KEY = "bucket-list:data"; // must match index.html exactly

const CATEGORY_COLOR = {
  landscapes: "#4a7c59",
  historic: "#a9682f",
  museums: "#3b5b92",
  culture: "#a83a4b",
};

const TIER_ORDER = ["Safe", "Moderate", "Risky", "Unrated"];

const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

let bucketData = {};       // raw data written by index.html
let lastRaw = null;        // for change detection
let state = { search: "", sortKey: "interest", hideVisited: false, expanded: {} };

function computeInterest(landmarks) {
  const list = landmarks || [];
  const active = list.filter(l => !l.visited);
  const score = active.reduce((s, l) => s + (l.rating || 0), 0);
  return { score, total: list.length, visited: list.length - active.length };
}

function buildRows() {
  const travelRows = window.computeTravelRows();
  const travelByName = Object.fromEntries(travelRows.map(r => [r.name, r]));

  // Union: countries added via index.html + any manually flagged in data.js
  const names = new Set([
    ...Object.keys(bucketData),
    ...Object.entries(window.TRAVEL_DATA).filter(([, d]) => d.bucketList).map(([n]) => n),
  ]);

  return Array.from(names).map(name => {
    const t = travelByName[name] || {
      name,
      continent: (window.TRAVEL_DATA[name] || {}).continent || "Other",
      safety: null,
      ethics: (window.TRAVEL_DATA[name] || {}).fh ?? null,
      overall: null,
    };
    const landmarks = (bucketData[name] || {}).landmarks || [];
    const interest = computeInterest(landmarks);
    return {
      ...t,
      landmarks,
      interestScore: interest.score,
      totalPlaces: interest.total,
      visitedPlaces: interest.visited,
      tier: window.safetyTier(t.safety),
    };
  });
}

function fmt(n) { return n == null ? null : Math.round(n); }

function miniBar(val) {
  const wrap = el('div', {});
  if (val == null) { wrap.appendChild(el('span', { class: 'na' }, '—')); return wrap; }
  const bar = el('div', { class: 'mini-bar' });
  const fill = el('div', {});
  fill.style.width = Math.max(2, val) + '%';
  bar.appendChild(fill);
  wrap.appendChild(el('span', { class: 'stat-value' }, String(fmt(val))));
  wrap.appendChild(bar);
  return wrap;
}

function renderLandmarks(row) {
  const wrap = el('div', { class: 'landmarks' });
  const items = row.landmarks.filter(l => !(state.hideVisited && l.visited));
  if (items.length === 0) {
    wrap.appendChild(el('div', { class: 'no-landmarks' },
      row.landmarks.length === 0 ? "No places added yet." : "All places here are visited."));
  } else {
    items
      .slice()
      .sort((a, b) => (a.visited === b.visited ? b.rating - a.rating : a.visited ? 1 : -1))
      .forEach(l => {
        const dots = el('div', { class: 'rating-dots' });
        for (let n = 1; n <= 5; n++) {
          dots.appendChild(el('span', { class: n <= l.rating ? 'on' : '' }));
        }
        wrap.appendChild(el('div', { class: 'landmark-row' + (l.visited ? ' visited' : '') },
          el('span', { class: 'cat-dot', style: `background:${CATEGORY_COLOR[l.category] || '#999'}` }),
          el('span', { class: 'landmark-name' }, l.name),
          dots
        ));
      });
  }
  wrap.appendChild(el('div', { class: 'edit-hint' }, "Edit places & ratings on the Raw Ranking page →"));
  return wrap;
}

function renderRow(row, idx) {
  const isOpen = !!state.expanded[row.name];
  const rowEl = el('div', { class: 'row' });
  const head = el('div', {
    class: 'row-head',
    onclick: () => { state.expanded[row.name] = !isOpen; render(); }
  },
    el('span', { class: 'rank' }, String(idx + 1).padStart(2, '0')),
    el('span', { class: 'chevron' }, isOpen ? '▼' : '▶'),
    el('div', { class: 'row-main' },
      el('div', { class: 'row-title-line' },
        el('div', {},
          el('span', { class: 'country-name' }, row.name),
          el('span', { class: 'continent-tag' }, row.continent)
        ),
        el('div', { class: 'stat-cluster' },
          el('div', { class: 'stat' },
            el('span', { class: 'stat-label' }, 'Safety'),
            miniBar(row.safety)
          ),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-label' }, 'Ethics'),
            miniBar(row.ethics)
          ),
          el('div', { class: 'stat' },
            el('span', { class: 'stat-label' }, 'Interest'),
            el('span', { class: 'interest-badge' }, String(row.interestScore))
          )
        )
      ),
      el('div', { class: 'places-count' },
        row.totalPlaces === 0
          ? "No places added"
          : `${row.totalPlaces - row.visitedPlaces} to visit${row.visitedPlaces ? ` · ${row.visitedPlaces} visited` : ''}`
      )
    )
  );
  rowEl.appendChild(head);
  if (isOpen) rowEl.appendChild(renderLandmarks(row));
  return rowEl;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const wrap = el('div', { class: 'wrap' });

  wrap.appendChild(el('h1', {}, "Final Ranking"));
  wrap.appendChild(el('div', { class: 'asof' },
    "Countries come from what you've added on the Raw Ranking page. Grouped by safety/ethics tier (from data.js), ranked within each tier by your interest score — the total rating of places you still want to see there."
  ));
  wrap.appendChild(el('div', { class: 'nav' },
    el('a', { href: 'index.html' }, '← Raw Ranking'),
    el('a', { href: 'safety.html' }, 'Safety & Ethics Table')
  ));

  const controls = el('div', { class: 'controls' });
  controls.appendChild(el('input', {
    type: 'text', placeholder: 'Search your countries...', value: state.search,
    oninput: e => { state.search = e.target.value; render(); }
  }));

  const sortGroup = el('div', { class: 'sort-group' });
  [{ key: 'interest', label: 'By Interest' }, { key: 'safety', label: 'By Safety' }, { key: 'ethics', label: 'By Ethics' }]
    .forEach(s => {
      sortGroup.appendChild(el('button', {
        class: state.sortKey === s.key ? 'active' : '',
        onclick: () => { state.sortKey = s.key; render(); }
      }, s.label));
    });
  controls.appendChild(sortGroup);

  controls.appendChild(el('label', { class: 'checkbox-label' },
    el('input', {
      type: 'checkbox', ...(state.hideVisited ? { checked: 'checked' } : {}),
      onchange: e => { state.hideVisited = e.target.checked; render(); }
    }),
    'Hide visited places'
  ));
  wrap.appendChild(controls);

  const sortField = state.sortKey === 'interest' ? 'interestScore' : state.sortKey;
  let rows = buildRows().filter(r =>
    !state.search || r.name.toLowerCase().includes(state.search.toLowerCase())
  );

  if (rows.length === 0) {
    wrap.appendChild(el('div', { class: 'empty' },
      "Nothing here yet — add a country and some places on the Raw Ranking page."
    ));
    root.appendChild(wrap);
    return;
  }

  TIER_ORDER.forEach(tier => {
    const tierRows = rows
      .filter(r => r.tier === tier)
      .sort((a, b) => {
        const av = a[sortField], bv = b[sortField];
        if (av == null && bv == null) return a.name.localeCompare(b.name);
        if (av == null) return 1;
        if (bv == null) return -1;
        return bv - av || a.name.localeCompare(b.name);
      });
    if (tierRows.length === 0) return;

    const section = el('div', { class: 'tier-section' });
    section.appendChild(el('div', { class: 'tier-head' },
      el('span', { class: 'tier-dot', style: `background:${window.TIER_COLORS[tier]}` }),
      el('span', { class: 'tier-title' }, tier),
      el('span', { class: 'tier-count' }, String(tierRows.length))
    ));
    tierRows.forEach((row, i) => section.appendChild(renderRow(row, i)));
    wrap.appendChild(section);
  });

  wrap.appendChild(el('div', { class: 'footnote' },
    "Tiers come from data.js (Safe ≥ 70, Moderate 40–69, Risky < 40, Unrated = missing data). Interest score = sum of your 1–5 ratings for places you haven't marked visited yet, from the Raw Ranking page. This page updates automatically when you add or rate places there."
  ));

  root.appendChild(wrap);
}

/* ---- reactivity: poll storage, plus instant updates via the storage
   event (fires across tabs) and on returning to this tab ---- */
async function refresh(force) {
  let raw;
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    raw = res ? res.value : "{}";
  } catch (e) {
    raw = "{}";
  }
  if (!force && raw === lastRaw) return;
  lastRaw = raw;
  try { bucketData = JSON.parse(raw || "{}"); } catch (e) { bucketData = {}; }
  render();
}

refresh(true);
setInterval(() => refresh(false), 2000);
window.addEventListener('storage', (e) => {
  if (!e.key || e.key.indexOf(STORAGE_KEY) !== -1) refresh(true);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh(true);
});
</script>
</body>
</html>
