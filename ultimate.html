<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Travel Bucket List — Final Ranking</title>
<link rel="stylesheet" href="styles.css" />
<script src="transitions.js" defer></script>
</head>
<body>

  <nav class="main-nav">
    <a href="index.html">Raw Ranking</a>
    <a href="safety.html">Safety</a>
    <a href="ultimate.html" aria-current="page">Final Ranking</a>
  </nav>

<div id="root"></div>
<script src="data.js"></script>
<script>
/* ---------------------------------------------------------------------
   window.storage shim — identical to the one in index.html, so this
   page reads the SAME bucket-list data that page writes. In a real
   Claude.ai artifact environment, window.storage already exists and
   this shim is skipped.
--------------------------------------------------------------------- */
window.storage = window.storage || {
  async get(key, shared = false) {
    const raw = localStorage.getItem((shared ? "shared:" : "personal:") + key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared };
  },
  async set(key, value, shared = false) {
    localStorage.setItem((shared ? "shared:" : "personal:") + key, value);
    return { key, value, shared };
  },
  async delete(key, shared = false) {
    localStorage.removeItem((shared ? "shared:" : "personal:") + key);
    return { key, deleted: true, shared };
  },
  async list(prefix = "", shared = false) {
    const scope = shared ? "shared:" : "personal:";
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(scope) && k.slice(scope.length).startsWith(prefix)) {
        keys.push(k.slice(scope.length));
      }
    }
    return { keys, prefix, shared };
  },
};

const STORAGE_KEY = "bucket-list:data";       // must match index.html exactly
const WEIGHTS_KEY = "bucket-list:weights";    // this page's tunable weights

const CATEGORY_COLOR = {
  landscapes: "#4a7c59",
  historic: "#a9682f",
  museums: "#3b5b92",
  culture: "#a83a4b",
};

const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

let bucketData = {};       // countries map written by index.html: { [name]: { landmarks: [...] } }
let groupsData = {};       // trip groups written by index.html: { [id]: { name, countries: [...] } }
let lastRaw = null;        // for change detection
let state = {
  search: "",
  sortKey: "blended",       // 'blended' | 'interest' | 'safety' | 'ethics'
  hideVisited: false,
  view: "countries",        // 'countries' | 'grouped'
  expanded: {},
  avoidOpen: false,
  showInfo: false,
  ethicsWeight: window.DEFAULT_ETHICS_WEIGHT,
  safetyWeight: window.DEFAULT_SAFETY_WEIGHT,
};

function computeInterest(landmarks) {
  const list = landmarks || [];
  const active = list.filter(l => !l.visited);
  const score = active.reduce((s, l) => s + (l.rating || 0), 0);
  return { score, total: list.length, visited: list.length - active.length };
}

function mean(nums) {
  const vals = nums.filter(v => v != null);
  if (vals.length === 0) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

// Builds one row per country that's either in your bucket data or
// manually flagged bucketList:true in data.js. This is the base unit
// both the Countries view and the Grouped view are built from.
function buildCountryRows() {
  const travelRows = window.computeTravelRows();
  const travelByName = Object.fromEntries(travelRows.map(r => [r.name, r]));

  const names = new Set([
    ...Object.keys(bucketData),
    ...Object.entries(window.TRAVEL_DATA).filter(([, d]) => d.bucketList).map(([n]) => n),
  ]);

  return Array.from(names).map(name => {
    const t = travelByName[name] || {
      name,
      continent: (window.TRAVEL_DATA[name] || {}).continent || "Other",
      safety: null,
      ethics: (window.TRAVEL_DATA[name] || {}).fh ?? null,
      overall: null,
    };
    const landmarks = (bucketData[name] || {}).landmarks || [];
    const interest = computeInterest(landmarks);

    const zone = window.travelZone(t.safety);
    const riskFrac = window.computeRiskPenaltyFrac(t.safety, state.safetyWeight);
    const ethicsFrac = window.computeEthicsAdjustmentFrac(t.ethics, state.ethicsWeight);
    const blended = interest.score * (1 + ethicsFrac) * (1 - riskFrac);

    return {
      kind: "country",
      ...t,
      landmarks,
      interestScore: interest.score,
      totalPlaces: interest.total,
      visitedPlaces: interest.visited,
      zone,
      riskFrac,
      ethicsFrac,
      blended,
    };
  });
}

// Builds one row per trip group that has at least one member country
// you're tracking. Safety/ethics are averaged across member countries
// (so the group's "go/avoid" zone and its blended-score adjustment are
// based on that average); interest is the sum of the members' interest
// scores, same as Raw Ranking's Grouped view. Individual member stats
// are still shown underneath, unaveraged, when the group is expanded.
function buildGroupRows(countryRowsByName) {
  return Object.entries(groupsData || {}).map(([id, g]) => {
    const memberNames = (g.countries || []).filter(name => countryRowsByName[name]);
    if (memberNames.length === 0) return null;
    const members = memberNames.map(name => countryRowsByName[name]);

    const interestScore = members.reduce((s, m) => s + m.interestScore, 0);
    const avgSafety = mean(members.map(m => m.safety));
    const avgEthics = mean(members.map(m => m.ethics));

    const zone = window.travelZone(avgSafety);
    const riskFrac = window.computeRiskPenaltyFrac(avgSafety, state.safetyWeight);
    const ethicsFrac = window.computeEthicsAdjustmentFrac(avgEthics, state.ethicsWeight);
    const blended = interestScore * (1 + ethicsFrac) * (1 - riskFrac);

    return {
      kind: "group",
      id,
      name: g.name,
      members,
      safety: avgSafety,
      ethics: avgEthics,
      interestScore,
      totalPlaces: members.reduce((s, m) => s + m.totalPlaces, 0),
      visitedPlaces: members.reduce((s, m) => s + m.visitedPlaces, 0),
      zone,
      riskFrac,
      ethicsFrac,
      blended,
    };
  }).filter(Boolean);
}

function fmt(n) { return n == null ? null : Math.round(n); }
function fmtPct(frac) {
  if (!frac) return "0%";
  return Math.round(Math.abs(frac) * 100) + "%";
}

function miniBar(val) {
  const wrap = el('div', {});
  if (val == null) { wrap.appendChild(el('span', { class: 'na' }, '—')); return wrap; }
  const bar = el('div', { class: 'mini-bar' });
  const fill = el('div', {});
  fill.style.width = Math.max(2, val) + '%';
  bar.appendChild(fill);
  wrap.appendChild(el('span', { class: 'stat-value' }, String(fmt(val))));
  wrap.appendChild(bar);
  return wrap;
}

function renderLandmarks(row) {
  const wrap = el('div', { class: 'landmarks' });
  const items = row.landmarks.filter(l => !(state.hideVisited && l.visited));
  if (items.length === 0) {
    wrap.appendChild(el('div', { class: 'no-landmarks' },
      row.landmarks.length === 0 ? "No places added yet." : "All places here are visited."));
  } else {
    items
      .slice()
      .sort((a, b) => (a.visited === b.visited ? b.rating - a.rating : a.visited ? 1 : -1))
      .forEach(l => {
        const dots = el('div', { class: 'rating-dots' });
        for (let n = 1; n <= 5; n++) {
          dots.appendChild(el('span', { class: n <= l.rating ? 'on' : '' }));
        }
        wrap.appendChild(el('div', { class: 'landmark-row' + (l.visited ? ' visited' : '') },
          el('span', { class: 'cat-dot', style: `background:${CATEGORY_COLOR[l.category] || '#999'}` }),
          el('span', { class: 'landmark-name' }, l.name),
          dots
        ));
      });
  }
  wrap.appendChild(el('div', { class: 'edit-hint' }, "Edit places & ratings on the Raw Ranking page →"));
  return wrap;
}

// Shared stat cluster (safety / ethics / score badge) for both a
// standalone country row and a country row nested inside a group.
function renderStatCluster(row) {
  return el('div', { class: 'stat-cluster' },
    el('div', { class: 'stat' },
      el('span', { class: 'stat-label' }, 'Safety'),
      miniBar(row.safety),
      row.riskFrac > 0.005 ? el('span', { class: 'penalty-tag' }, `−${fmtPct(row.riskFrac)}`) : null
    ),
    el('div', { class: 'stat' },
      el('span', { class: 'stat-label' }, 'Ethics'),
      miniBar(row.ethics),
      Math.abs(row.ethicsFrac) > 0.005 ? el('span', { class: 'penalty-tag', style: row.ethicsFrac > 0 ? 'color:#1a7a3c' : 'color:#c0392b' }, `${row.ethicsFrac > 0 ? '+' : '−'}${fmtPct(row.ethicsFrac)}`) : null
    ),
    el('div', { class: 'stat' },
      el('span', { class: 'stat-label' }, state.sortKey === 'blended' ? 'Score' : 'Interest'),
      el('span', { class: 'interest-badge' }, String(state.sortKey === 'blended' ? Math.round(row.blended) : row.interestScore))
    )
  );
}

function renderRow(row, idx) {
  const isOpen = !!state.expanded[row.name];
  const rowEl = el('div', { class: 'row' });
  const head = el('div', {
    class: 'row-head',
    onclick: () => { state.expanded[row.name] = !isOpen; render(); }
  },
    el('span', { class: 'rank' }, String(idx + 1).padStart(2, '0')),
    el('span', { class: 'chevron' }, isOpen ? '▼' : '▶'),
    el('div', { class: 'row-main' },
      el('div', { class: 'row-title-line' },
        el('div', {},
          el('span', { class: 'entry-name' }, row.name),
          el('span', { class: 'continent-tag ml-tag' }, row.continent)
        ),
        renderStatCluster(row)
      ),
      el('div', { class: 'places-count' },
        row.totalPlaces === 0
          ? "No places added"
          : `${row.totalPlaces - row.visitedPlaces} to visit${row.visitedPlaces ? ` · ${row.visitedPlaces} visited` : ''}`
      )
    )
  );
  rowEl.appendChild(head);
  if (isOpen) rowEl.appendChild(renderLandmarks(row));
  return rowEl;
}

function renderGroupRow(row, idx) {
  const key = `group:${row.id}`;
  const isOpen = !!state.expanded[key];
  const rowEl = el('div', { class: 'row' });
  const head = el('div', {
    class: 'row-head',
    onclick: () => { state.expanded[key] = !isOpen; render(); }
  },
    el('span', { class: 'rank' }, String(idx + 1).padStart(2, '0')),
    el('span', { class: 'chevron' }, isOpen ? '▼' : '▶'),
    el('div', { class: 'row-main' },
      el('div', { class: 'row-title-line' },
        el('div', {},
          el('span', { class: 'entry-name group-name' }, row.name),
          el('span', { class: 'group-tag' }, `${row.members.length} ${row.members.length === 1 ? 'country' : 'countries'} · avg`)
        ),
        renderStatCluster(row)
      ),
      el('div', { class: 'places-count' },
        row.totalPlaces === 0
          ? "No places added"
          : `${row.totalPlaces - row.visitedPlaces} to visit across group${row.visitedPlaces ? ` · ${row.visitedPlaces} visited` : ''}`
      )
    )
  );
  rowEl.appendChild(head);
  if (isOpen) {
    const body = el('div', { class: 'group-body' });
    body.appendChild(el('div', { class: 'group-members-head' }, 'Members — individual stats, expand for places'));
    const membersWrap = el('div', { class: 'group-members' });
    row.members
      .slice()
      .sort((a, b) => b.interestScore - a.interestScore || a.name.localeCompare(b.name))
      .forEach((m, i) => membersWrap.appendChild(renderRow(m, i)));
    body.appendChild(membersWrap);
    rowEl.appendChild(body);
  }
  return rowEl;
}

function renderEntry(entry, idx) {
  return entry.kind === 'group' ? renderGroupRow(entry, idx) : renderRow(entry, idx);
}

function renderAvoidSection(avoidEntries) {
  const section = el('div', { class: 'avoid-section' });
  const toggle = el('div', {
    class: 'avoid-toggle',
    onclick: () => { state.avoidOpen = !state.avoidOpen; render(); }
  },
    el('span', { class: 'avoid-chevron' }, state.avoidOpen ? '▼' : '▶'),
    el('span', { class: 'tier-dot' }),
    el('span', { class: 'avoid-title' }, 'Avoid — major risk'),
    el('span', { class: 'avoid-count' }, String(avoidEntries.length))
  );
  section.appendChild(toggle);
  if (state.avoidOpen) {
    const list = el('div', { class: 'avoid-list' });
    avoidEntries
      .slice()
      .sort((a, b) => a.name.localeCompare(b.name))
      .forEach(entry => {
        list.appendChild(el('div', { class: 'avoid-row' },
          el('span', { class: 'avoid-name' }, entry.kind === 'group' ? `${entry.name} (group)` : entry.name),
          el('span', { class: 'avoid-reason' }, `${entry.kind === 'group' ? 'avg ' : ''}safety ${fmt(entry.safety)}`)
        ));
      });
    section.appendChild(list);
    section.appendChild(el('div', { class: 'avoid-note' },
      `Below safety ${window.MAJOR_RISK_CUTOFF} — excluded regardless of interest or ethics. See the i above for the formula.`
    ));
  }
  return section;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const wrap = el('div', { class: 'wrap' });

  const titleRow = el('div', { class: 'title-row' },
    el('h1', {}, "Final Ranking"),
    el('button', {
      class: 'info-btn',
      'aria-label': state.showInfo ? 'Hide methodology' : 'Show methodology',
      title: 'How this ranking works',
      onclick: () => { state.showInfo = !state.showInfo; render(); }
    }, 'i')
  );
  wrap.appendChild(titleRow);

  if (state.showInfo) {
    wrap.appendChild(el('div', { class: 'info-panel' },
      el('div', {}, "Interest = Σ(1–5 ratings) over unvisited places. Grouped view sums this across a group's countries."),
      el('div', { style: 'margin-top:6px;' },
        `Ethics % = (Freedom House − 50) / 50 × ethics weight. FH runs 0–100; 50 is neutral. Purely a bonus/malus on score — never excludes a country.`
      ),
      el('div', { style: 'margin-top:6px;' },
        `Risk % = (${window.SAFE_THRESHOLD} − safety) / (${window.SAFE_THRESHOLD} − ${window.MAJOR_RISK_CUTOFF}) × risk weight, for safety in [${window.MAJOR_RISK_CUTOFF}, ${window.SAFE_THRESHOLD}). 0% at safety ≥ ${window.SAFE_THRESHOLD}. Safety < ${window.MAJOR_RISK_CUTOFF} moves a country to Avoid, excluded outright regardless of interest or ethics. Unrated safety is treated as no penalty.`
      ),
      el('div', { style: 'margin-top:6px;' },
        `Blended score = interest × (1 + ethics %) × (1 − risk %). The other sort buttons rank by one raw stat instead. In Grouped view, safety/ethics are the average across a group's countries; interest is their sum.`
      ),
      el('div', { style: 'margin-top:6px;' },
        "Weights above are tunable per-session and saved. Updates live as you edit the Raw Ranking page."
      )
    ));
  }

  const controls = el('div', { class: 'controls panel-controls' });
  controls.appendChild(el('input', {
    type: 'text', placeholder: 'Search your countries...', value: state.search,
    oninput: e => { state.search = e.target.value; render(); }
  }));

  const sortGroup = el('div', { class: 'toggle-group' });
  [
    { key: 'blended', label: 'Blended' },
    { key: 'interest', label: 'By Interest' },
    { key: 'safety', label: 'By Safety' },
    { key: 'ethics', label: 'By Ethics' },
  ].forEach(s => {
    sortGroup.appendChild(el('button', {
      class: state.sortKey === s.key ? 'active' : '',
      onclick: () => { state.sortKey = s.key; render(); }
    }, s.label));
  });
  controls.appendChild(sortGroup);

  controls.appendChild(el('label', { class: 'checkbox-label' },
    el('input', {
      type: 'checkbox', ...(state.hideVisited ? { checked: 'checked' } : {}),
      onchange: e => { state.hideVisited = e.target.checked; render(); }
    }),
    'Hide visited places'
  ));
  wrap.appendChild(controls);

  // ---- view toggle: Countries vs Grouped ----
  const viewRow = el('div', { class: 'view-row' });
  const viewGroup = el('div', { class: 'toggle-group' });
  [
    { key: 'countries', label: 'Countries' },
    { key: 'grouped', label: 'Grouped' },
  ].forEach(v => {
    viewGroup.appendChild(el('button', {
      class: state.view === v.key ? 'active' : '',
      onclick: () => { state.view = v.key; render(); }
    }, v.label));
  });
  viewRow.appendChild(viewGroup);
  wrap.appendChild(viewRow);

  // ---- weight sliders ----
  const weights = el('div', { class: 'weights' });
  weights.appendChild(el('div', { class: 'weight-item' },
    el('div', { class: 'weight-label-row' },
      el('span', { class: 'weight-label' }, 'Ethics weight'),
      el('span', { class: 'weight-value' }, `±${state.ethicsWeight}%`)
    ),
    el('input', {
      type: 'range', min: '0', max: '40', step: '1', value: String(state.ethicsWeight),
      oninput: e => { state.ethicsWeight = parseFloat(e.target.value); render(); },
      onchange: () => saveWeights(),
    })
  ));
  weights.appendChild(el('div', { class: 'weight-item' },
    el('div', { class: 'weight-label-row' },
      el('span', { class: 'weight-label' }, 'Risk sensitivity'),
      el('span', { class: 'weight-value' }, `−${state.safetyWeight}% max`)
    ),
    el('input', {
      type: 'range', min: '0', max: '40', step: '1', value: String(state.safetyWeight),
      oninput: e => { state.safetyWeight = parseFloat(e.target.value); render(); },
      onchange: () => saveWeights(),
    })
  ));
  wrap.appendChild(weights);

  const sortFieldMap = { blended: 'blended', interest: 'interestScore', safety: 'safety', ethics: 'ethics' };
  const sortField = sortFieldMap[state.sortKey];

  const countryRows = buildCountryRows();
  const countryRowsByName = Object.fromEntries(countryRows.map(r => [r.name, r]));

  const searchLower = state.search.trim().toLowerCase();
  const matchesSearchCountry = r => !searchLower || r.name.toLowerCase().includes(searchLower);
  const matchesSearchGroup = g => !searchLower
    || g.name.toLowerCase().includes(searchLower)
    || g.members.some(m => m.name.toLowerCase().includes(searchLower));

  let entries;
  if (state.view === 'grouped') {
    const groupedNames = new Set(Object.values(groupsData || {}).flatMap(g => g.countries || []));
    const ungrouped = countryRows.filter(r => !groupedNames.has(r.name)).filter(matchesSearchCountry);
    const groupRows = buildGroupRows(countryRowsByName).filter(matchesSearchGroup);
    entries = [...ungrouped, ...groupRows];
  } else {
    entries = countryRows.filter(matchesSearchCountry);
  }

  if (countryRows.length === 0) {
    wrap.appendChild(el('div', { class: 'empty' },
      "Nothing here yet — add a country and some places on the Raw Ranking page."
    ));
    root.appendChild(wrap);
    return;
  }

  const goEntries = entries.filter(e => e.zone === 'go');
  const avoidEntries = entries.filter(e => e.zone === 'avoid');

  const sortedGo = goEntries.slice().sort((a, b) => {
    const av = a[sortField], bv = b[sortField];
    if (av == null && bv == null) return a.name.localeCompare(b.name);
    if (av == null) return 1;
    if (bv == null) return -1;
    return bv - av || a.name.localeCompare(b.name);
  });

  if (sortedGo.length === 0) {
    wrap.appendChild(el('div', { class: 'empty' }, "No matches outside the major-risk list."));
  } else {
    const section = el('div', { class: 'tier-section' });
    section.appendChild(el('div', { class: 'tier-head' },
      el('span', { class: 'tier-dot', style: 'background:#1a7a3c' }),
      el('span', { class: 'tier-title' }, 'Ready to explore'),
      el('span', { class: 'tier-count' }, String(sortedGo.length))
    ));
    sortedGo.forEach((entry, i) => section.appendChild(renderEntry(entry, i)));
    wrap.appendChild(section);
  }

  if (avoidEntries.length > 0) {
    wrap.appendChild(renderAvoidSection(avoidEntries));
  }

  root.appendChild(wrap);
}

async function saveWeights() {
  try {
    await window.storage.set(WEIGHTS_KEY, JSON.stringify({
      ethicsWeight: state.ethicsWeight,
      safetyWeight: state.safetyWeight,
    }), false);
  } catch (e) { /* non-fatal */ }
}

async function loadWeights() {
  try {
    const res = await window.storage.get(WEIGHTS_KEY, false);
    const saved = JSON.parse(res.value);
    if (typeof saved.ethicsWeight === 'number') state.ethicsWeight = saved.ethicsWeight;
    if (typeof saved.safetyWeight === 'number') state.safetyWeight = saved.safetyWeight;
  } catch (e) { /* no saved weights yet — use defaults */ }
}

/* ---- reactivity: poll storage, plus instant updates via the storage
   event (fires across tabs) and on returning to this tab ---- */
async function refresh(force) {
  let raw;
  try {
    const res = await window.storage.get(STORAGE_KEY, false);
    raw = res ? res.value : "{}";
  } catch (e) {
    raw = "{}";
  }
  if (!force && raw === lastRaw) return;
  lastRaw = raw;

  let parsed;
  try { parsed = JSON.parse(raw || "{}"); } catch (e) { parsed = {}; }

  if (parsed && (parsed.countries || parsed.groups)) {
    // current format written by index.html: { countries: {...}, groups: {...} }
    bucketData = parsed.countries || {};
    groupsData = parsed.groups || {};
  } else {
    // legacy format: the stored object *was* the countries map directly,
    // with no groups. Without this fallback, this page would silently
    // treat the whole object as a single bogus "country" once index.html
    // switched formats to add groups — which is exactly what was
    // happening before this fix.
    bucketData = parsed || {};
    groupsData = {};
  }
  render();
}

(async () => {
  await loadWeights();
  await refresh(true);
})();
setInterval(() => refresh(false), 2000);
window.addEventListener('storage', (e) => {
  if (!e.key || e.key.indexOf(STORAGE_KEY) !== -1) refresh(true);
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') refresh(true);
});
</script>
</body>
</html>
