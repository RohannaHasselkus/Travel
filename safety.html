const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

function computeRows() {
  return Object.entries(DATA).map(([name, d]) => {
    // Safety: GPI (peace/conflict) 40% + WPS security-relevant score 40% + advisory penalty 20%
    let gpiScore = null;
    if (d.gpi != null) {
      const clamped = Math.max(1.1, Math.min(3.4, d.gpi));
      gpiScore = 100 - ((clamped - 1.1) / (3.4 - 1.1)) * 100;
    }
    let wpsScore = d.wps != null ? d.wps * 100 : null;

    let penalty = 0;
    if (d.us === 'L4') penalty += 35;
    else if (d.us === 'L3') penalty += 14;
    if (d.uk === 'ALL') penalty += 25;
    else if (d.uk === 'ESS') penalty += 10;
    if (d.es === 'ALL') penalty += 20;

    let base = null, weightSum = 0, weighted = 0;
    if (gpiScore != null) { weighted += gpiScore * 0.55; weightSum += 0.55; }
    if (wpsScore != null) { weighted += wpsScore * 0.45; weightSum += 0.45; }
    if (weightSum > 0) base = weighted / weightSum;

    let safety = base != null ? Math.max(0, base - penalty) : (penalty > 0 ? Math.max(0, 45 - penalty) : null);
    const ethics = d.fh != null ? d.fh : null;

    let overall = null;
    if (safety != null && ethics != null) overall = safety * 0.7 + ethics * 0.3;
    else if (safety != null) overall = safety;
    else if (ethics != null) overall = ethics;

    return { name, ...d, safety, ethics, overall };
  });
}

const ALL_ROWS = computeRows();

let state = { search:'', continent:'All', sortKey:'safety', sortDir:'desc', hideAdvisory:false };

function fmt(n) { return n == null ? null : Math.round(n); }

function scoreBar(val) {
  const wrap = el('div', {class:'score-bar-wrap'});
  if (val == null) { wrap.appendChild(el('span',{class:'na'},'—')); return wrap; }
  const bar = el('div', {class:'score-bar'});
  const fill = el('div', {});
  fill.style.width = Math.max(2, val) + '%';
  bar.appendChild(fill);
  wrap.appendChild(bar);
  wrap.appendChild(el('span',{}, String(fmt(val))));
  return wrap;
}

function advisoryFlags(d) {
  const wrap = el('div', {});
  if (d.us === 'L4') wrap.appendChild(el('span',{class:'flag severe'},'US4'));
  else if (d.us === 'L3') wrap.appendChild(el('span',{class:'flag mid'},'US3'));
  if (d.uk === 'ALL') wrap.appendChild(el('span',{class:'flag severe'},'UK'));
  else if (d.uk === 'ESS') wrap.appendChild(el('span',{class:'flag mid'},'UK ess.'));
  if (d.es === 'ALL') wrap.appendChild(el('span',{class:'flag severe'},'ES'));
  if (!wrap.childNodes.length) wrap.appendChild(el('span',{class:'na'},'—'));
  return wrap;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const wrap = el('div', {class:'wrap'});

  wrap.appendChild(el('h1', {}, "Safest & Most Ethical Countries"));
  wrap.appendChild(el('div', {class:'asof'}, "Snapshot: Sep 2026 · GPI + Women, Peace & Security Index + US/UK/ES advisories → Safety · Freedom House → Ethics"));

  const controls = el('div', {class:'controls'});
  const search = el('input', {type:'text', placeholder:'Search country...', value: state.search, oninput: e => { state.search = e.target.value; render(); }});
  controls.appendChild(search);

  const contSel = el('select', {onchange: e => { state.continent = e.target.value; render(); }});
  ['All','Africa','Americas','Asia','Europe','Oceania'].forEach(c => {
    contSel.appendChild(el('option', {value:c, ...(state.continent===c?{selected:'selected'}:{})}, c));
  });
  controls.appendChild(contSel);

  const toggle = el('div', {class:'toggle-group'});
  toggle.appendChild(el('button', {class: !state.hideAdvisory ? 'active':'', onclick: () => { state.hideAdvisory=false; render(); }}, 'All'));
  toggle.appendChild(el('button', {class: state.hideAdvisory ? 'active':'', onclick: () => { state.hideAdvisory=true; render(); }}, 'No advisories'));
  controls.appendChild(toggle);

  wrap.appendChild(controls);

  let rows = ALL_ROWS.filter(r => {
    if (state.continent !== 'All' && r.continent !== state.continent) return false;
    if (state.search && !r.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    if (state.hideAdvisory && (r.us || r.uk || r.es)) return false;
    return true;
  });

  const sortKey = state.sortKey;
  rows.sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av == null && bv == null) return a.name.localeCompare(b.name);
    if (av == null) return 1;
    if (bv == null) return -1;
    return state.sortDir === 'desc' ? bv - av : av - bv;
  });

  const table = el('table', {});
  const headDefs = [
    {key:null, label:'#'},
    {key:'name', label:'Country'},
    {key:'safety', label:'Safety'},
    {key:'ethics', label:'Ethics'},
    {key:'overall', label:'Overall'},
    {key:null, label:'Advisory'},
  ];
  const thead = el('tr', {});
  headDefs.forEach(h => {
    const th = el('th', {class: h.key===sortKey ? 'active':''});
    th.appendChild(document.createTextNode(h.label + ' '));
    if (h.key === sortKey) th.appendChild(el('span',{class:'arrow'}, state.sortDir==='desc'?'▼':'▲'));
    if (h.key) th.addEventListener('click', () => {
      if (state.sortKey === h.key) state.sortDir = state.sortDir === 'desc' ? 'asc':'desc';
      else { state.sortKey = h.key; state.sortDir = 'desc'; }
      render();
    });
    thead.appendChild(th);
  });
  table.appendChild(el('thead', {}, thead));

  const tbody = el('tbody', {});
  if (rows.length === 0) {
    tbody.appendChild(el('tr',{}, el('td',{colspan:'6', class:'empty'}, 'No matches.')));
  }
  rows.forEach((r, i) => {
    const tr = el('tr', {});
    tr.appendChild(el('td', {}, el('span',{class:'rank-num'}, String(i+1))));
    tr.appendChild(el('td', {}, el('div',{class:'country-name'}, r.name), el('div',{class:'continent-tag'}, r.continent)));
    tr.appendChild(el('td', {}, scoreBar(r.safety)));
    tr.appendChild(el('td', {}, scoreBar(r.ethics)));
    tr.appendChild(el('td', {}, scoreBar(r.overall)));
    tr.appendChild(el('td', {}, advisoryFlags(r)));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  wrap.appendChild(el('div', {class:'footnote'},
    "Safety = Global Peace Index + Women, Peace & Security Index (women's safety/inclusion/justice) − advisory penalties (US/UK/Spain). Ethics = Freedom House score. Sorted by Safety by default. Static snapshot — re-check official advisories before travel."
  ));

  root.appendChild(wrap);
}

render();
