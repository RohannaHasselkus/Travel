<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Safest & Most Ethical Countries to Visit</title>
<style>
  html, body { margin:0; padding:0; background:#fff; }
  * { box-sizing: border-box; }
  body { font-family: ui-sans-serif, system-ui, sans-serif; color:#111; }
  .wrap { max-width: 900px; margin: 0 auto; padding: 2rem 1.1rem 3rem; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-weight:400; font-size: 30px; letter-spacing:-0.02em; margin:0 0 4px; }
  .asof { font-size:11px; color:#999; margin-bottom:10px; }
  .nav { font-size:12.5px; margin-bottom:16px; }
  .nav a { color:#111; text-decoration:none; border-bottom:1px solid #111; }
  .nav a:hover { opacity:0.6; }
  .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  input[type=text] { flex:1 1 180px; padding:8px 10px; border:1px solid #ccc; font-size:14px; font-family:inherit; }
  select { padding:8px 10px; border:1px solid #ccc; font-size:13px; font-family:inherit; background:#fff; }
  .toggle-group { display:flex; border:1px solid #111; }
  .toggle-group button { padding:8px 11px; font-size:12px; border:none; background:#fff; cursor:pointer; border-left:1px solid #111; white-space:nowrap; }
  .toggle-group button:first-child { border-left:none; }
  .toggle-group button.active { background:#111; color:#fff; }
  table { width:100%; border-collapse: collapse; font-size:13.5px; }
  th, td { text-align:left; padding:7px 5px; border-bottom:1px solid #eee; }
  th { font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:#666; cursor:pointer; user-select:none; border-bottom:2px solid #111; white-space:nowrap; }
  th.active { color:#111; }
  th .arrow { font-size:9px; }
  tr:hover td { background:#fafafa; }
  .country-name { font-weight:600; }
  .continent-tag { font-size:9.5px; color:#999; }
  .score-bar-wrap { display:flex; align-items:center; gap:5px; }
  .score-bar { height:6px; width:44px; background:#eee; position:relative; flex-shrink:0; }
  .score-bar > div { height:100%; background:#111; }
  .flag { display:inline-block; font-size:9.5px; padding:1px 4px; border-radius:2px; margin-right:2px; margin-bottom:2px; border:1px solid; white-space:nowrap; }
  .flag.severe { background:#c0392b; border-color:#c0392b; color:#fff; }
  .flag.mid { background:#fff8e6; border-color:#b8860b; color:#8a6300; }
  .na { color:#bbb; }
  .rank-num { font-family: monospace; color:#999; font-size:11px; }
  .bucket-star { font-size:15px; color:#ddd; margin-left:6px; user-select:none; cursor:default; }
  .bucket-star.on { color:#c9a227; }
  .empty { text-align:center; color:#999; padding:2rem 0; }
  .footnote { font-size:10.5px; color:#aaa; margin-top:20px; line-height:1.5; }
  .warn-banner { font-size:11.5px; color:#8a6300; background:#fff8e6; border:1px solid #f0d98c; padding:8px 10px; margin-bottom:14px; }
  @media (max-width: 640px) {
    th, td { padding:5px 3px; font-size:11.5px; }
    .score-bar { width:30px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="data.js"></script>
<script>
const el = (tag, attrs, ...children) => {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'class') e.className = attrs[k];
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  children.flat().forEach(c => {
    if (c === null || c === undefined) return;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  });
  return e;
};

// ---------------------------------------------------------------------
// Bucket list data now comes straight from the Bucket List app's own
// storage (the same key it reads/writes via window.storage), not from
// a separate hand-maintained flag in data.js. This keeps the star here
// in sync with whatever countries actually exist in your bucket list.
// The Bucket List app persists with `window.storage.set(key, value, false)`,
// which in the plain-browser shim writes to localStorage as
// "personal:" + key. We read the same location directly.
// ---------------------------------------------------------------------
const BUCKET_STORAGE_KEY = "personal:bucket-list:data";

function getBucketCountrySet() {
  try {
    const raw = localStorage.getItem(BUCKET_STORAGE_KEY);
    if (!raw) return new Set();
    const parsed = JSON.parse(raw);
    return new Set(Object.keys(parsed));
  } catch (e) {
    return new Set();
  }
}

let bucketDataMissing = false;

function getRows() {
  const rows = window.computeTravelRows();
  const bucketSet = getBucketCountrySet();
  bucketDataMissing = bucketSet.size === 0;
  return rows.map(r => ({ ...r, onBucketList: bucketSet.has(r.name) }));
}

let state = { search:'', continent:'All', sortKey:'safety', sortDir:'desc', hideAdvisory:false, bucketOnly:false };

function fmt(n) { return n == null ? null : Math.round(n); }

function scoreBar(val) {
  const wrap = el('div', {class:'score-bar-wrap'});
  if (val == null) { wrap.appendChild(el('span',{class:'na'},'—')); return wrap; }
  const bar = el('div', {class:'score-bar'});
  const fill = el('div', {});
  fill.style.width = Math.max(2, val) + '%';
  bar.appendChild(fill);
  wrap.appendChild(bar);
  wrap.appendChild(el('span',{}, String(fmt(val))));
  return wrap;
}

function advisoryFlags(d) {
  const wrap = el('div', {});
  if (d.us === 'L4') wrap.appendChild(el('span',{class:'flag severe'},'US4'));
  else if (d.us === 'L3') wrap.appendChild(el('span',{class:'flag mid'},'US3'));
  if (d.uk === 'ALL') wrap.appendChild(el('span',{class:'flag severe'},'UK'));
  else if (d.uk === 'ESS') wrap.appendChild(el('span',{class:'flag mid'},'UK ess.'));
  if (d.es === 'ALL') wrap.appendChild(el('span',{class:'flag severe'},'ES'));
  if (!wrap.childNodes.length) wrap.appendChild(el('span',{class:'na'},'—'));
  return wrap;
}

function render() {
  const root = document.getElementById('root');
  root.innerHTML = '';
  const wrap = el('div', {class:'wrap'});

  wrap.appendChild(el('h1', {}, "Safest & Most Ethical Countries"));
  wrap.appendChild(el('div', {class:'asof'}, "Snapshot: Sep 2026 · GPI + Women, Peace & Security Index + US/UK/ES advisories → Safety · Freedom House → Ethics"));
  wrap.appendChild(el('div', {class:'nav'}, el('a', {href:'ultimate.html'}, "→ View my bucket list & safety chart"), " · ", el('a', {href:'index.html'}, "→ Edit my bucket list")));

  let rows = getRows();

  if (bucketDataMissing) {
    wrap.appendChild(el('div', {class:'warn-banner'},
      "No bucket list found in this browser. Add countries on the Bucket List page (index.html) first — the star column here reads directly from that data."
    ));
  }

  const controls = el('div', {class:'controls'});
  const search = el('input', {type:'text', placeholder:'Search country...', value: state.search, oninput: e => { state.search = e.target.value; render(); }});
  controls.appendChild(search);

  const contSel = el('select', {onchange: e => { state.continent = e.target.value; render(); }});
  ['All','Africa','Americas','Asia','Europe','Oceania'].forEach(c => {
    contSel.appendChild(el('option', {value:c, ...(state.continent===c?{selected:'selected'}:{})}, c));
  });
  controls.appendChild(contSel);

  const toggle = el('div', {class:'toggle-group'});
  toggle.appendChild(el('button', {class: !state.hideAdvisory ? 'active':'', onclick: () => { state.hideAdvisory=false; render(); }}, 'All'));
  toggle.appendChild(el('button', {class: state.hideAdvisory ? 'active':'', onclick: () => { state.hideAdvisory=true; render(); }}, 'No advisories'));
  controls.appendChild(toggle);

  const bucketToggle = el('div', {class:'toggle-group'});
  bucketToggle.appendChild(el('button', {class: !state.bucketOnly ? 'active':'', onclick: () => { state.bucketOnly=false; render(); }}, 'All countries'));
  bucketToggle.appendChild(el('button', {class: state.bucketOnly ? 'active':'', onclick: () => { state.bucketOnly=true; render(); }}, 'My bucket list'));
  controls.appendChild(bucketToggle);

  wrap.appendChild(controls);

  rows = rows.filter(r => {
    if (state.continent !== 'All' && r.continent !== state.continent) return false;
    if (state.search && !r.name.toLowerCase().includes(state.search.toLowerCase())) return false;
    if (state.hideAdvisory && (r.us || r.uk || r.es)) return false;
    if (state.bucketOnly && !r.onBucketList) return false;
    return true;
  });

  const sortKey = state.sortKey;
  rows.sort((a,b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (av == null && bv == null) return a.name.localeCompare(b.name);
    if (av == null) return 1;
    if (bv == null) return -1;
    return state.sortDir === 'desc' ? bv - av : av - bv;
  });

  const table = el('table', {});
  const headDefs = [
    {key:null, label:'#'},
    {key:'name', label:'Country'},
    {key:'safety', label:'Safety'},
    {key:'ethics', label:'Ethics'},
    {key:'overall', label:'Overall'},
    {key:null, label:'Advisory'},
    {key:null, label:'Bucket'},
  ];
  const thead = el('tr', {});
  headDefs.forEach(h => {
    const th = el('th', {class: h.key===sortKey ? 'active':''});
    th.appendChild(document.createTextNode(h.label + ' '));
    if (h.key === sortKey) th.appendChild(el('span',{class:'arrow'}, state.sortDir==='desc'?'▼':'▲'));
    if (h.key) th.addEventListener('click', () => {
      if (state.sortKey === h.key) state.sortDir = state.sortDir === 'desc' ? 'asc':'desc';
      else { state.sortKey = h.key; state.sortDir = 'desc'; }
      render();
    });
    thead.appendChild(th);
  });
  table.appendChild(el('thead', {}, thead));

  const tbody = el('tbody', {});
  if (rows.length === 0) {
    tbody.appendChild(el('tr',{}, el('td',{colspan:'7', class:'empty'}, 'No matches.')));
  }
  rows.forEach((r, i) => {
    const tr = el('tr', {});
    tr.appendChild(el('td', {}, el('span',{class:'rank-num'}, String(i+1))));
    tr.appendChild(el('td', {}, el('div',{class:'country-name'}, r.name), el('div',{class:'continent-tag'}, r.continent)));
    tr.appendChild(el('td', {}, scoreBar(r.safety)));
    tr.appendChild(el('td', {}, scoreBar(r.ethics)));
    tr.appendChild(el('td', {}, scoreBar(r.overall)));
    tr.appendChild(el('td', {}, advisoryFlags(r)));
    const star = el('span', {
      class: 'bucket-star' + (r.onBucketList ? ' on' : ''),
      title: r.onBucketList
        ? 'On your bucket list (add/remove it from index.html)'
        : 'Not on your bucket list (add it from index.html)'
    }, r.onBucketList ? '★' : '☆');
    tr.appendChild(el('td', {}, star));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);

  wrap.appendChild(el('div', {class:'footnote'},
    "Safety = Global Peace Index + Women, Peace & Security Index (women's safety/inclusion/justice) − advisory penalties (US/UK/Spain). Ethics = Freedom House score. Sorted by Safety by default. Safety/ethics data lives in data.js — edit it to update this page. The ★ column reflects your actual Bucket List app data (read from this browser's local storage) — add or remove countries on index.html, not here."
  ));

  root.appendChild(wrap);
}

render();

// Keep this page in sync if the bucket list changes in another tab.
window.addEventListener('storage', (e) => {
  if (e.key === BUCKET_STORAGE_KEY) render();
});
</script>
</body>
</html>
