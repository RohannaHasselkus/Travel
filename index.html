/* ---------------------------------------------------------------------
   Minimal inline-SVG stand-ins for the lucide-react icons used by the
   original component (Plus, X, ChevronDown, ChevronRight, MapPin,
   Loader2, Undo2, Download, Check). Same prop shape (size, className,
   style, color) so the rest of the component code is untouched.
--------------------------------------------------------------------- */
function makeIcon(paths) {
  return function Icon({ size = 16, color = "currentColor", style, className, ...rest }) {
    return (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke={color}
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        style={style}
        className={className}
        {...rest}
      >
        {paths}
      </svg>
    );
  };
}

/* ---------------------------------------------------------------------
   window.storage shim: the persistent key/value storage API used by
   Claude.ai artifacts isn't available in a plain browser page, so it's
   replaced here with an equivalent backed by localStorage. Same
   async get/set(key, value, shared) signature, so BucketList's code
   below is unmodified from the original.
--------------------------------------------------------------------- */
window.storage = window.storage || {
  async get(key, shared = false) {
    const raw = localStorage.getItem((shared ? "shared:" : "personal:") + key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared };
  },
  async set(key, value, shared = false) {
    localStorage.setItem((shared ? "shared:" : "personal:") + key, value);
    return { key, value, shared };
  },
  async delete(key, shared = false) {
    localStorage.removeItem((shared ? "shared:" : "personal:") + key);
    return { key, deleted: true, shared };
  },
  async list(prefix = "", shared = false) {
    const scope = shared ? "shared:" : "personal:";
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(scope) && k.slice(scope.length).startsWith(prefix)) {
        keys.push(k.slice(scope.length));
      }
    }
    return { keys, prefix, shared };
  },
};

const STORAGE_KEY = "bucket-list:data";

function RatingTally({ value, onChange, size = 14 }) {
  return (
    <div style={{ display: "flex", gap: 3 }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <button
          key={n}
          type="button"
          onClick={() => onChange && onChange(n)}
          aria-label={`Set interest to ${n}`}
          style={{
            width: size,
            height: size,
            border: "1px solid black",
            background: n <= value ? "black" : "white",
            cursor: onChange ? "pointer" : "default",
            padding: 0,
            flexShrink: 0,
          }}
        />
      ))}
    </div>
  );
}

function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function BucketList() {
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [undoStack, setUndoStack] = useState([]);
  const [countryQuery, setCountryQuery] = useState("");
  const [search, setSearch] = useState("");
  const [hideVisited, setHideVisited] = useState(false);
  const [view, setView] = useState("ranked");
  const [expanded, setExpanded] = useState({});
  const [landmarkDrafts, setLandmarkDrafts] = useState({});
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        setData(res ? JSON.parse(res.value) : {});
      } catch (e) {
        setData({});
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  };

  const persist = async (next, undoLabel) => {
    setUndoStack((u) => [...u.slice(-(UNDO_LIMIT - 1)), data]);
    setData(next);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      setSaveError(!res);
    } catch (e) {
      setSaveError(true);
    }
    if (undoLabel) showToast(undoLabel);
  };

  const undo = async () => {
    if (undoStack.length === 0) return;
    const prev = undoStack[undoStack.length - 1];
    setUndoStack((u) => u.slice(0, -1));
    setData(prev);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(prev), false);
      setSaveError(!res);
    } catch (e) {
      setSaveError(true);
    }
    showToast("Undone");
  };

  if (!loaded) {
    return (
      <div style={{ display: "flex", alignItems: "center", justifyContent: "center", padding: "4rem 0", color: "black" }}>
        <Loader2 className="animate-spin" size={20} />
        <span style={{ marginLeft: 8, fontFamily: "monospace", fontSize: 13 }}>loading</span>
      </div>
    );
  }

  const countryNames = Object.keys(data);
  const availableCountries = COUNTRIES.filter(
    (c) => !countryNames.includes(c) && c.toLowerCase().includes(countryQuery.toLowerCase())
  );

  const searchLower = search.trim().toLowerCase();

  const allRows = countryNames.map((name) => {
    const landmarks = data[name].landmarks || [];
    const activeLandmarks = landmarks.filter((l) => !l.visited);
    const score = activeLandmarks.reduce((s, l) => s + l.rating, 0);
    const visitedCount = landmarks.length - activeLandmarks.length;
    return { name, landmarks, score, visitedCount, continent: CONTINENT_OF[name] || "Other" };
  });

  const maxScore = Math.max(1, ...allRows.map((r) => r.score));

  const matchesSearch = (row) => {
    if (!searchLower) return true;
    if (row.name.toLowerCase().includes(searchLower)) return true;
    return row.landmarks.some((l) => l.name.toLowerCase().includes(searchLower));
  };

  const visibleRows = allRows.filter(matchesSearch).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

  const addCountry = (name) => {
    if (!name || data[name]) return;
    persist({ ...data, [name]: { landmarks: [] } });
    setCountryQuery("");
  };

  const removeCountry = (name) => {
    const next = { ...data };
    delete next[name];
    persist(next, `Removed ${name}`);
  };

  const addLandmark = (country) => {
    const draft = landmarkDrafts[country];
    const name = (draft?.name || "").trim();
    if (!name) return;
    const rating = draft?.rating || 3;
    const landmarks = data[country].landmarks || [];
    const next = {
      ...data,
      [country]: {
        ...data[country],
        landmarks: [...landmarks, { id: `${Date.now()}-${Math.random()}`, name, rating, visited: false }],
      },
    };
    persist(next);
    setLandmarkDrafts({ ...landmarkDrafts, [country]: { name: "", rating: 3 } });
  };

  const removeLandmark = (country, id) => {
    const landmark = (data[country].landmarks || []).find((l) => l.id === id);
    const landmarks = (data[country].landmarks || []).filter((l) => l.id !== id);
    persist({ ...data, [country]: { ...data[country], landmarks } }, landmark ? `Removed ${landmark.name}` : undefined);
  };

  const updateLandmarkRating = (country, id, rating) => {
    const landmarks = (data[country].landmarks || []).map((l) => (l.id === id ? { ...l, rating } : l));
    persist({ ...data, [country]: { ...data[country], landmarks } });
  };

  const toggleVisited = (country, id) => {
    const landmarks = (data[country].landmarks || []).map((l) => (l.id === id ? { ...l, visited: !l.visited } : l));
    persist({ ...data, [country]: { ...data[country], landmarks } });
  };

  const toggle = (name) => setExpanded((e) => ({ ...e, [name]: !e[name] }));

  const exportMarkdown = () => {
    const byContinent = {};
    allRows.forEach((r) => {
      if (!byContinent[r.continent]) byContinent[r.continent] = [];
      byContinent[r.continent].push(r);
    });
    let out = "# Travel bucket list\n\n";
    Object.keys(byContinent)
      .sort()
      .forEach((cont) => {
        out += `## ${cont}\n\n`;
        byContinent[cont]
          .sort((a, b) => b.score - a.score)
          .forEach((r) => {
            out += `### ${r.name} (score: ${r.score})\n\n`;
            r.landmarks
              .slice()
              .sort((a, b) => b.rating - a.rating)
              .forEach((l) => {
                out += `- [${l.visited ? "x" : " "}] ${l.name} — interest ${l.rating}/5\n`;
              });
            out += "\n";
          });
      });
    downloadFile("bucket-list.md", out, "text/markdown");
    showToast("Exported bucket-list.md");
  };

  const jumpToCountry = (name) => {
    setView("ranked");
    setSearch("");
    setExpanded((e) => ({ ...e, [name]: true }));
  };

  const continentGroups = {};
  visibleRows.forEach((r) => {
    if (!continentGroups[r.continent]) continentGroups[r.continent] = [];
    continentGroups[r.continent].push(r);
  });

  const renderLandmarks = (row) => {
    const items = row.landmarks.filter((l) => !(hideVisited && l.visited));
    return (
      <div style={{ paddingLeft: 32, paddingBottom: 16 }}>
        {items.length > 0 && (
          <div style={{ marginBottom: 12 }}>
            {items
              .slice()
              .sort((a, b) => (a.visited === b.visited ? b.rating - a.rating : a.visited ? 1 : -1))
              .map((l) => (
                <div
                  key={l.id}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    padding: "6px 0",
                    borderBottom: "1px solid #f0f0f0",
                    opacity: l.visited ? 0.45 : 1,
                  }}
                >
                  <button
                    onClick={() => toggleVisited(row.name, l.id)}
                    aria-label={l.visited ? `Mark ${l.name} as not visited` : `Mark ${l.name} as visited`}
                    style={{
                      width: 16,
                      height: 16,
                      border: "1px solid black",
                      background: l.visited ? "black" : "white",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      cursor: "pointer",
                      padding: 0,
                      flexShrink: 0,
                    }}
                  >
                    {l.visited && <Check size={11} color="white" />}
                  </button>
                  <MapPin size={13} style={{ color: "#999", flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 14, textDecoration: l.visited ? "line-through" : "none" }}>
                    {l.name}
                  </span>
                  <RatingTally value={l.rating} onChange={(v) => updateLandmarkRating(row.name, l.id, v)} />
                  <button
                    onClick={() => removeLandmark(row.name, l.id)}
                    aria-label={`Remove ${l.name}`}
                    style={{ border: "none", background: "none", cursor: "pointer", color: "#ccc", padding: 2 }}
                  >
                    <X size={13} />
                  </button>
                </div>
              ))}
          </div>
        )}
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <input
            type="text"
            value={landmarkDrafts[row.name]?.name || ""}
            onChange={(e) =>
              setLandmarkDrafts({
                ...landmarkDrafts,
                [row.name]: { ...(landmarkDrafts[row.name] || { rating: 3 }), name: e.target.value },
              })
            }
            onKeyDown={(e) => e.key === "Enter" && addLandmark(row.name)}
            placeholder="Add a place..."
            style={{
              flex: "1 1 160px",
              padding: "7px 10px",
              border: "1px solid #ccc",
              fontSize: 13,
              fontFamily: "inherit",
              outline: "none",
            }}
          />
          <RatingTally
            value={landmarkDrafts[row.name]?.rating || 3}
            onChange={(v) =>
              setLandmarkDrafts({
                ...landmarkDrafts,
                [row.name]: { ...(landmarkDrafts[row.name] || { name: "" }), rating: v },
              })
            }
            size={16}
          />
          <button
            onClick={() => addLandmark(row.name)}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 4,
              padding: "7px 12px",
              border: "1px solid black",
              background: "black",
              color: "white",
              fontSize: 13,
              cursor: "pointer",
            }}
          >
            <Plus size={13} />
            Add
          </button>
        </div>
      </div>
    );
  };

  const renderRow = (row, i) => {
    const isOpen = !!expanded[row.name];
    const barPct = row.score === 0 ? 0 : Math.max(4, (row.score / maxScore) * 100);
    const shownLandmarks = row.landmarks.filter((l) => !(hideVisited && l.visited));
    return (
      <div key={row.name} style={{ borderBottom: "1px solid #ddd" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", cursor: "pointer" }} onClick={() => toggle(row.name)}>
          <span style={{ fontFamily: "monospace", fontSize: 13, color: "#999", width: 20 }}>
            {String(i + 1).padStart(2, "0")}
          </span>
          {isOpen ? <ChevronDown size={16} /> : <ChevronRight size={16} />}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
              <span style={{ fontFamily: "Georgia, serif", fontSize: 17 }}>{row.name}</span>
              <span style={{ fontFamily: "monospace", fontSize: 14, whiteSpace: "nowrap" }}>{row.score}</span>
            </div>
            <div style={{ height: 6, background: "#eee", marginTop: 6, position: "relative" }}>
              <div style={{ height: "100%", width: `${barPct}%`, background: "black" }} />
            </div>
            <div style={{ fontSize: 11, color: "#888", marginTop: 4 }}>
              {shownLandmarks.length} {shownLandmarks.length === 1 ? "place" : "places"}
              {row.visitedCount > 0 && !hideVisited ? ` · ${row.visitedCount} visited` : ""}
            </div>
          </div>
          <button
            onClick={(e) => {
              e.stopPropagation();
              removeCountry(row.name);
            }}
            aria-label={`Remove ${row.name}`}
            style={{ border: "none", background: "none", cursor: "pointer", color: "#aaa", padding: 4 }}
          >
            <X size={16} />
          </button>
        </div>
        {isOpen && renderLandmarks(row)}
      </div>
    );
  };

  return (
    <div
      style={{
        background: "white",
        color: "black",
        minHeight: "100vh",
        fontFamily: "ui-sans-serif, system-ui, sans-serif",
        padding: "2.5rem 1.5rem",
        position: "relative",
      }}
    >
      <div style={{ maxWidth: 780, margin: "0 auto" }}>
        <header style={{ marginBottom: "2rem", borderBottom: "2px solid black", paddingBottom: "1.25rem" }}>
          <h1 style={{ fontFamily: "Georgia, 'Times New Roman', serif", fontSize: 40, fontWeight: 400, letterSpacing: "-0.02em", margin: 0 }}>
            Bucket List
          </h1>
          <p style={{ margin: "6px 0 0", fontSize: 13, color: "#555", letterSpacing: "0.02em" }}>
            countries ranked by places you want to see, and how badly you want to see them
          </p>
        </header>

        <section style={{ marginBottom: "1.75rem" }}>
          <label style={{ display: "block", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: "#555", marginBottom: 8 }}>
            Add a country
          </label>
          <div style={{ position: "relative" }}>
            <input
              type="text"
              value={countryQuery}
              onChange={(e) => setCountryQuery(e.target.value)}
              placeholder="Search countries..."
              style={{ width: "100%", boxSizing: "border-box", padding: "10px 12px", border: "1px solid black", fontSize: 14, fontFamily: "inherit", outline: "none", background: "white", color: "black" }}
            />
            {countryQuery.trim().length > 0 && (
              <div style={{ border: "1px solid black", borderTop: "none", maxHeight: 220, overflowY: "auto", background: "white" }}>
                {availableCountries.length === 0 && (
                  <div style={{ padding: "10px 12px", fontSize: 13, color: "#888" }}>No matches, or already added</div>
                )}
                {availableCountries.slice(0, 8).map((c) => (
                  <button
                    key={c}
                    onClick={() => addCountry(c)}
                    style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", textAlign: "left", padding: "9px 12px", background: "white", border: "none", borderTop: "1px solid #eee", cursor: "pointer", fontSize: 14, fontFamily: "inherit", color: "black" }}
                    onMouseEnter={(e) => (e.currentTarget.style.background = "#f2f2f2")}
                    onMouseLeave={(e) => (e.currentTarget.style.background = "white")}
                  >
                    <Plus size={14} />
                    {c}
                  </button>
                ))}
              </div>
            )}
          </div>
        </section>

        <section style={{ display: "flex", flexWrap: "wrap", gap: 10, alignItems: "center", marginBottom: "1.5rem", borderTop: "1px solid #ddd", borderBottom: "1px solid #ddd", padding: "10px 0" }}>
          <input
            type="text"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Search your list..."
            style={{ flex: "1 1 180px", padding: "7px 10px", border: "1px solid #ccc", fontSize: 13, fontFamily: "inherit", outline: "none" }}
          />
          <div style={{ display: "flex", border: "1px solid black" }}>
            {[
              { key: "ranked", label: "Ranked" },
              { key: "continent", label: "Continent" },
              { key: "map", label: "Map" },
            ].map((v, idx) => (
              <button
                key={v.key}
                onClick={() => setView(v.key)}
                style={{
                  padding: "7px 12px",
                  fontSize: 12,
                  border: "none",
                  borderLeft: idx === 0 ? "none" : "1px solid black",
                  background: view === v.key ? "black" : "white",
                  color: view === v.key ? "white" : "black",
                  cursor: "pointer",
                }}
              >
                {v.label}
              </button>
            ))}
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: "#555", cursor: "pointer" }}>
            <input type="checkbox" checked={hideVisited} onChange={(e) => setHideVisited(e.target.checked)} />
            Hide visited
          </label>
          <button
            onClick={undo}
            disabled={undoStack.length === 0}
            style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 10px", fontSize: 12, border: "1px solid #ccc", background: "white", cursor: undoStack.length ? "pointer" : "default", color: undoStack.length ? "black" : "#ccc" }}
          >
            <Undo2 size={13} />
            Undo
          </button>
          <button
            onClick={exportMarkdown}
            style={{ display: "flex", alignItems: "center", gap: 5, padding: "7px 10px", fontSize: 12, border: "1px solid black", background: "white", cursor: "pointer" }}
          >
            <Download size={13} />
            Export
          </button>
        </section>

        {visibleRows.length === 0 && (
          <p style={{ fontSize: 14, color: "#888", padding: "2rem 0", textAlign: "center" }}>
            {countryNames.length === 0 ? "Add a country above, then add landmarks to start ranking." : "No matches for your search."}
          </p>
        )}

        {view === "ranked" && visibleRows.length > 0 && (
          <section>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", borderBottom: "1px solid black", paddingBottom: 8, marginBottom: 4 }}>
              <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: "#555" }}>Ranking</span>
              <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: "#555" }}>Score</span>
            </div>
            {visibleRows.map((row, i) => renderRow(row, i))}
          </section>
        )}

        {view === "continent" && visibleRows.length > 0 && (
          <section>
            {Object.keys(continentGroups)
              .sort()
              .map((cont) => (
                <div key={cont} style={{ marginBottom: 24 }}>
                  <h2 style={{ fontFamily: "Georgia, serif", fontSize: 15, textTransform: "uppercase", letterSpacing: "0.06em", borderBottom: "1px solid black", paddingBottom: 6, marginBottom: 4 }}>
                    {cont}
                  </h2>
                  {continentGroups[cont].map((row, i) => renderRow(row, i))}
                </div>
              ))}
          </section>
        )}

        {view === "map" && (
          <section>
            <svg viewBox={MAP_VIEWBOX} style={{ width: "100%", height: "auto", border: "1px solid #eee" }}>
              {MAP_PATHS.map((c) => {
                const row = allRows.find((r) => r.name === c.name);
                let fill = "#ffffff";
                if (row) {
                  if (row.score === 0) fill = "#e8e8e8";
                  else {
                    const t = row.score / maxScore;
                    const shade = Math.round(225 - t * 195);
                    fill = `rgb(${shade},${shade},${shade})`;
                  }
                }
                return (
                  <path
                    key={c.name}
                    d={c.d}
                    fill={fill}
                    stroke="#999"
                    strokeWidth={0.4}
                    style={{ cursor: row ? "pointer" : "default" }}
                    onClick={() => row && jumpToCountry(c.name)}
                  >
                    <title>{row ? `${c.name} — score ${row.score}` : c.name}</title>
                  </path>
                );
              })}
            </svg>
            <p style={{ fontSize: 11, color: "#999", marginTop: 8 }}>
              Darker fill means a higher score. Click a shaded country to jump to it in your list. Some very small nations aren't visible at this map scale but still appear in Ranked and Continent views.
            </p>
          </section>
        )}

        <footer style={{ marginTop: "2rem", fontSize: 11, color: "#aaa", textAlign: "center" }}>
          {saveError ? "Could not save — your changes may not persist." : "Saved automatically."}
        </footer>
      </div>

      {toast && (
        <div style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", background: "black", color: "white", padding: "8px 16px", fontSize: 13, borderRadius: 2 }}>
          {toast}
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BucketList />);
</script>
</body>
</html>
