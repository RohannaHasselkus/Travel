   Minimal inline-SVG stand-ins for the lucide-react icons used by this
   component (Plus, X, ChevronDown, ChevronRight, MapPin, Loader2,
   Undo2, Check).
--------------------------------------------------------------------- */
function makeIcon(paths) {
  return function Icon({ size = 16, color = "currentColor", style, className, ...rest }) {
    return (
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width={size}
        height={size}
        viewBox="0 0 24 24"
        fill="none"
        stroke={color}
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        style={style}
        className={className}
        {...rest}
      >
        {paths}
      </svg>
    );
  };
}

/* ---------------------------------------------------------------------
   window.storage shim: the persistent key/value storage API used by
   Claude.ai artifacts isn't available in a plain browser page, so it's
   replaced here with an equivalent backed by localStorage. Same
   async get/set(key, value, shared) signature.
--------------------------------------------------------------------- */
window.storage = window.storage || {
  async get(key, shared = false) {
    const raw = localStorage.getItem((shared ? "shared:" : "personal:") + key);
    if (raw === null) throw new Error("not found");
    return { key, value: raw, shared };
  },
  async set(key, value, shared = false) {
    localStorage.setItem((shared ? "shared:" : "personal:") + key, value);
    return { key, value, shared };
  },
  async delete(key, shared = false) {
    localStorage.removeItem((shared ? "shared:" : "personal:") + key);
    return { key, deleted: true, shared };
  },
  async list(prefix = "", shared = false) {
    const scope = shared ? "shared:" : "personal:";
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(scope) && k.slice(scope.length).startsWith(prefix)) {
        keys.push(k.slice(scope.length));
      }
    }
    return { keys, prefix, shared };
  },
};

const COUNTRIES = COUNTRY_CONTINENTS.map((c) => c.name);
const CONTINENT_OF = Object.fromEntries(COUNTRY_CONTINENTS.map((c) => [c.name, c.continent]));

const THEME = {

  borderMuted: "#dddddd", borderFaint: "#eeeeee",

const STORAGE_KEY = "bucket-list:data";
const UNDO_LIMIT = 15;

const CATEGORIES = [
  { key: "landscapes", label: "Landscapes", color: "#4a7c59" },
  { key: "historic", label: "Historic Sites", color: "#a9682f" },
  { key: "museums", label: "Museums", color: "#3b5b92" },
  { key: "culture", label: "Living Culture", color: "#a83a4b" },
];

function RatingTally({ value, onChange, size = 14 }) {
  return (
    <div style={{ display: "flex", gap: 3 }}>
      {[1, 2, 3, 4, 5].map((n) => (
        <button
          key={n}
          type="button"
          onClick={() => onChange && onChange(n)}
          aria-label={`Set interest to ${n}`}

            width: size,
            height: size,
            border: `1px solid ${THEME.border}`,

function BucketList() {
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [undoStack, setUndoStack] = useState([]);
  const [countryQuery, setCountryQuery] = useState("");
  const [search, setSearch] = useState("");
  const [hideVisited, setHideVisited] = useState(false);
  const [view, setView] = useState("ranked");
  const [expanded, setExpanded] = useState({});
  const [landmarkDrafts, setLandmarkDrafts] = useState({});
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);
  const [lightbox, setLightbox] = useState(null); // { title, caption, url }

  useEffect(() => {
    (async () => {
      try {
        const res = await window.storage.get(STORAGE_KEY, false);
        setData(res ? JSON.parse(res.value) : {});
      } catch (e) {
        setData({});
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!lightbox) return;
    const onKey = (e) => {
      if (e.key === "Escape") setLightbox(null);
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [lightbox]);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  };

  const persist = async (next, undoLabel) => {
    setUndoStack((u) => [...u.slice(-(UNDO_LIMIT - 1)), data]);
    setData(next);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(next), false);
      setSaveError(!res);
    } catch (e) {
      setSaveError(true);
    }
    if (undoLabel) showToast(undoLabel);
  };

  const undo = async () => {
    if (undoStack.length === 0) return;
    const prev = undoStack[undoStack.length - 1];
    setUndoStack((u) => u.slice(0, -1));
    setData(prev);
    try {
      const res = await window.storage.set(STORAGE_KEY, JSON.stringify(prev), false);
      setSaveError(!res);
    } catch (e) {
      setSaveError(true);
    }
    showToast("Undone");
  };

  if (!loaded) {
    return (
      <div
        style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          minHeight: "100vh",
          background: THEME.bg,
          color: THEME.fg,
        }}
      >
        <Loader2 className="bl-spin" size={20} />
        <span style={{ marginLeft: 8, fontFamily: "monospace", fontSize: 13 }}>loading</span>
      </div>
    );
  }

  const countryNames = Object.keys(data);
  const availableCountries = COUNTRIES.filter(
    (c) => !countryNames.includes(c) && c.toLowerCase().includes(countryQuery.toLowerCase())
  );

  const searchLower = search.trim().toLowerCase();

  const allRows = countryNames.map((name) => {
    const landmarks = data[name].landmarks || [];
    const activeLandmarks = landmarks.filter((l) => !l.visited);
    const score = activeLandmarks.reduce((s, l) => s + l.rating, 0);
    const visitedCount = landmarks.length - activeLandmarks.length;
    return { name, landmarks, score, visitedCount, continent: CONTINENT_OF[name] || "Other" };
  });

  const maxScore = Math.max(1, ...allRows.map((r) => r.score));

  const matchesSearch = (row) => {
    if (!searchLower) return true;
    if (row.name.toLowerCase().includes(searchLower)) return true;
    return row.landmarks.some((l) => l.name.toLowerCase().includes(searchLower));
  };

  const visibleRows = allRows.filter(matchesSearch).sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));

  const openLightbox = (title, caption, url) => {
    if (!url) return;
    setLightbox({ title, caption, url });
  };
  const closeLightbox = () => setLightbox(null);

  const addCountry = (name) => {
    if (!name || data[name]) return;
    persist({ ...data, [name]: { landmarks: [] } });
    setCountryQuery("");
  };

  const removeCountry = (name) => {
    const next = { ...data };
    delete next[name];
    persist(next, `Removed ${name}`);
  };

  const addLandmark = (country) => {
    const draft = landmarkDrafts[country];
    const name = (draft?.name || "").trim();
    if (!name) return;
    const rating = draft?.rating || 3;
    const imageUrl = (draft?.imageUrl || "").trim() || null;
    const category = draft?.category || CATEGORIES[0].key;
    const landmarks = data[country].landmarks || [];
    const next = {
      ...data,
      [country]: {
        ...data[country],
        landmarks: [...landmarks, { id: `${Date.now()}-${Math.random()}`, name, rating, visited: false, imageUrl, category }],
      },
    };
    persist(next);
    setLandmarkDrafts({ ...landmarkDrafts, [country]: { name: "", rating: 3, imageUrl: "", category: CATEGORIES[0].key } });
  };

  const removeLandmark = (country, id) => {
    const landmark = (data[country].landmarks || []).find((l) => l.id === id);
    const landmarks = (data[country].landmarks || []).filter((l) => l.id !== id);
    persist({ ...data, [country]: { ...data[country], landmarks } }, landmark ? `Removed ${landmark.name}` : undefined);
  };

  const updateLandmarkRating = (country, id, rating) => {
    const landmarks = (data[country].landmarks || []).map((l) => (l.id === id ? { ...l, rating } : l));
    persist({ ...data, [country]: { ...data[country], landmarks } });
  };

  const cycleLandmarkCategory = (country, id) => {
    const landmarks = (data[country].landmarks || []).map((l) => {
      if (l.id !== id) return l;
      const currentIdx = CATEGORIES.findIndex((c) => c.key === (l.category || CATEGORIES[0].key));
      const next = CATEGORIES[(currentIdx + 1) % CATEGORIES.length].key;
      return { ...l, category: next };
    });
    persist({ ...data, [country]: { ...data[country], landmarks } });
  };

  const toggleVisited = (country, id) => {
    const landmarks = (data[country].landmarks || []).map((l) => (l.id === id ? { ...l, visited: !l.visited } : l));
    persist({ ...data, [country]: { ...data[country], landmarks } });
  };

  const toggle = (name) => setExpanded((e) => ({ ...e, [name]: !e[name] }));

  const continentGroups = {};
  visibleRows.forEach((r) => {
    if (!continentGroups[r.continent]) continentGroups[r.continent] = [];
    continentGroups[r.continent].push(r);
  });

  const renderLandmarks = (row) => {
    const items = row.landmarks.filter((l) => !(hideVisited && l.visited));
    return (
      <div style={{ paddingLeft: 32, paddingBottom: 16 }}>
        {items.length > 0 && (
          <div style={{ marginBottom: 12 }}>
            {items
              .slice()
              .sort((a, b) => (a.visited === b.visited ? b.rating - a.rating : a.visited ? 1 : -1))
              .map((l) => (
                <div
                  key={l.id}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    padding: "6px 0",
                    borderBottom: `1px solid ${THEME.borderFaint}`,
                    opacity: l.visited ? 0.45 : 1,
                  }}
                >
                  <button
                    onClick={() => toggleVisited(row.name, l.id)}
                    aria-label={l.visited ? `Mark ${l.name} as not visited` : `Mark ${l.name} as visited`}
                    style={{
                      width: 16,
                      height: 16,
                      border: `1px solid ${THEME.border}`,
                      background: l.visited ? THEME.fg : THEME.bg,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      cursor: "pointer",
                      padding: 0,
                      flexShrink: 0,
                    }}
                  >
                    {l.visited && <Check size={11} color={THEME.bg} />}
                  </button>
                  <button
                    onClick={() => cycleLandmarkCategory(row.name, l.id)}
                    title={`${CATEGORY_OF[l.category || CATEGORIES[0].key].label} — click to change`}
                    aria-label={`Category: ${CATEGORY_OF[l.category || CATEGORIES[0].key].label}. Click to change.`}
                    style={{
                      width: 12,
                      height: 12,
                      borderRadius: "50%",
                      border: `1px solid ${THEME.borderMuted}`,
                      background: CATEGORY_OF[l.category || CATEGORIES[0].key].color,
                      cursor: "pointer",
                      padding: 0,
                      flexShrink: 0,
                    }}
                  />
                  {l.imageUrl ? (
                    <button
                      onClick={() => openLightbox(row.name, l.name, l.imageUrl)}
                      aria-label={`View photo of ${l.name}`}
                      style={{
                        width: 22,
                        height: 22,
                        padding: 0,
                        border: `1px solid ${THEME.border}`,
                        background: "none",
                        cursor: "pointer",
                        flexShrink: 0,
                        overflow: "hidden",
                      }}
                    >
                      <img
                        src={l.imageUrl}
                        alt=""
                        style={{ width: "100%", height: "100%", objectFit: "cover", display: "block" }}
                        onError={(e) => {
                          e.target.style.opacity = 0.15;
                        }}
                      />
                    </button>
                  ) : (
                    <MapPin size={13} style={{ color: THEME.mutedLight, flexShrink: 0 }} />
                  )}
                  <span style={{ flex: 1, fontSize: 14, textDecoration: l.visited ? "line-through" : "none" }}>
                    {l.name}
                  </span>
                  <RatingTally value={l.rating} onChange={(v) => updateLandmarkRating(row.name, l.id, v)} />
                  <button
                    onClick={() => removeLandmark(row.name, l.id)}
                    aria-label={`Remove ${l.name}`}
                    style={{ border: "none", background: "none", cursor: "pointer", color: THEME.mutedFaint, padding: 2 }}
                  >
                    <X size={13} />
                  </button>
                </div>
              ))}
          </div>
        )}
        <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap" }}>
          <input
            type="text"
            value={landmarkDrafts[row.name]?.name || ""}
            onChange={(e) =>
              setLandmarkDrafts({
                ...landmarkDrafts,
                [row.name]: { ...(landmarkDrafts[row.name] || { rating: 3, imageUrl: "" }), name: e.target.value },
              })
            }
            onKeyDown={(e) => e.key === "Enter" && addLandmark(row.name)}
            placeholder="Add a place..."
            style={{
              flex: "1 1 140px",
              padding: "7px 10px",
              border: `1px solid ${THEME.inputBorder}`,
              fontSize: 13,
              fontFamily: "inherit",
              outline: "none",
              background: THEME.panel,
              color: THEME.fg,
            }}
          />
          <input
            type="text"
            value={landmarkDrafts[row.name]?.imageUrl || ""}
            onChange={(e) =>
              setLandmarkDrafts({
                ...landmarkDrafts,
                [row.name]: { ...(landmarkDrafts[row.name] || { name: "", rating: 3 }), imageUrl: e.target.value },
              })
            }
            onKeyDown={(e) => e.key === "Enter" && addLandmark(row.name)}
            placeholder="Image URL (optional)"
            style={{
              flex: "1 1 140px",
              padding: "7px 10px",
              border: `1px solid ${THEME.inputBorder}`,
              fontSize: 13,
              fontFamily: "inherit",
              outline: "none",
              background: THEME.panel,
              color: THEME.fg,
            }}
          />
          <CategoryPicker
            value={landmarkDrafts[row.name]?.category || CATEGORIES[0].key}
            onChange={(v) =>
              setLandmarkDrafts({
                ...landmarkDrafts,
                [row.name]: { ...(landmarkDrafts[row.name] || { name: "", imageUrl: "", rating: 3 }), category: v },
              })
            }
          />
          <RatingTally
            value={landmarkDrafts[row.name]?.rating || 3}
            onChange={(v) =>
              setLandmarkDrafts({
                ...landmarkDrafts,
                [row.name]: { ...(landmarkDrafts[row.name] || { name: "", imageUrl: "" }), rating: v },
              })
            }
            size={16}
          />
          <button
            onClick={() => addLandmark(row.name)}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 4,
              padding: "7px 12px",
              border: `1px solid ${THEME.border}`,
              background: THEME.chipActiveBg,
              color: THEME.chipActiveFg,
              fontSize: 13,
              cursor: "pointer",
            }}
          >
            <Plus size={13} />
            Add
          </button>
        </div>
      </div>
    );
  };

  const renderRow = (row, i) => {
    const isOpen = !!expanded[row.name];
    const barPct = row.score === 0 ? 0 : Math.max(4, (row.score / maxScore) * 100);
    const shownLandmarks = row.landmarks.filter((l) => !(hideVisited && l.visited));
    return (
      <div key={row.name} style={{ borderBottom: `1px solid ${THEME.borderMuted}` }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", cursor: "pointer" }} onClick={() => toggle(row.name)}>
          <span style={{ fontFamily: "monospace", fontSize: 13, color: THEME.mutedLight, width: 20 }}>
            {String(i + 1).padStart(2, "0")}
          </span>
          {isOpen ? <ChevronDown size={16} /> : <ChevronRight size={16} />}
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
              <span style={{ fontFamily: "Georgia, serif", fontSize: 17 }}>{row.name}</span>
              <span style={{ fontFamily: "monospace", fontSize: 14, whiteSpace: "nowrap" }}>{row.score}</span>
            </div>
            <div style={{ height: 6, background: THEME.trackBg, marginTop: 6, position: "relative" }}>
              <div style={{ height: "100%", width: `${barPct}%`, background: THEME.fg }} />
            </div>
            <div style={{ fontSize: 11, color: THEME.mutedLight, marginTop: 4 }}>
              {shownLandmarks.length} {shownLandmarks.length === 1 ? "place" : "places"}
              {row.visitedCount > 0 && !hideVisited ? ` · ${row.visitedCount} visited` : ""}
            </div>
          </div>
          <button
            onClick={(e) => {
              e.stopPropagation();
              removeCountry(row.name);
            }}
            aria-label={`Remove ${row.name}`}
            style={{ border: "none", background: "none", cursor: "pointer", color: THEME.mutedFaint, padding: 4 }}
          >
            <X size={16} />
          </button>
        </div>
        {isOpen && renderLandmarks(row)}
      </div>
    );
  };

  return (
    <div
      style={{
        background: THEME.bg,
        color: THEME.fg,
        minHeight: "100vh",
        fontFamily: "ui-sans-serif, system-ui, sans-serif",
        padding: "2.5rem 1.5rem",
        position: "relative",
      }}
    >
      <div style={{ maxWidth: 780, margin: "0 auto" }}>
        <header
          style={{
            marginBottom: "2rem",
            borderBottom: `2px solid ${THEME.border}`,
            paddingBottom: "1.25rem",
          }}
        >
          <h1 style={{ fontFamily: "Georgia, 'Times New Roman', serif", fontSize: 40, fontWeight: 400, letterSpacing: "-0.02em", margin: 0 }}>
            Bucket List
          </h1>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 12, marginTop: 12 }}>
            {CATEGORIES.map((c) => (
              <div key={c.key} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                <span style={{ width: 10, height: 10, borderRadius: "50%", background: c.color, display: "inline-block" }} />
                <span style={{ fontSize: 11, color: THEME.muted }}>{c.label}</span>
              </div>
            ))}
          </div>
        </header>

        <section style={{ marginBottom: "1.75rem" }}>
          <label style={{ display: "block", fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: THEME.muted, marginBottom: 8 }}>
            Country
          </label>
          <div style={{ position: "relative" }}>
            <input
              type="text"
              value={countryQuery}
              onChange={(e) => setCountryQuery(e.target.value)}
              placeholder="Search countries..."
              style={{
                width: "100%",
                boxSizing: "border-box",
                padding: "10px 12px",
                border: `1px solid ${THEME.border}`,
                fontSize: 14,
                fontFamily: "inherit",
                outline: "none",
                background: THEME.bg,
                color: THEME.fg,
              }}
            />
            {countryQuery.trim().length > 0 && (
              <div style={{ border: `1px solid ${THEME.border}`, borderTop: "none", maxHeight: 220, overflowY: "auto", background: THEME.panel }}>
                {availableCountries.length === 0 && (
                  <div style={{ padding: "10px 12px", fontSize: 13, color: THEME.mutedLight }}>No matches</div>
                )}
                {availableCountries.slice(0, 8).map((c) => (
                  <button
                    key={c}
                    onClick={() => addCountry(c)}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      gap: 8,
                      width: "100%",
                      textAlign: "left",
                      padding: "9px 12px",
                      background: THEME.panel,
                      border: "none",
                      borderTop: `1px solid ${THEME.borderFaint}`,
                      cursor: "pointer",
                      fontSize: 14,
                      fontFamily: "inherit",
                      color: THEME.fg,
                    }}
                    onMouseEnter={(e) => (e.currentTarget.style.background = THEME.hover)}
                    onMouseLeave={(e) => (e.currentTarget.style.background = THEME.panel)}
                  >
                    <Plus size={14} />
                    {c}
                  </button>
                ))}
              </div>
            )}
          </div>
        </section>

        <section
          style={{
            display: "flex",
            flexWrap: "wrap",
            gap: 10,
            alignItems: "center",
            marginBottom: "1.5rem",
            borderTop: `1px solid ${THEME.borderMuted}`,
            borderBottom: `1px solid ${THEME.borderMuted}`,
            padding: "10px 0",
          }}
        >
          <input
            type="text"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder="Search your list..."
            style={{
              flex: "1 1 180px",
              padding: "7px 10px",
              border: `1px solid ${THEME.inputBorder}`,
              fontSize: 13,
              fontFamily: "inherit",
              outline: "none",
              background: THEME.panel,
              color: THEME.fg,
            }}
          />
          <div style={{ display: "flex", border: `1px solid ${THEME.border}` }}>
            {[
              { key: "ranked", label: "Ranked" },
              { key: "continent", label: "Continent" },
            ].map((v, idx) => (
              <button
                key={v.key}
                onClick={() => setView(v.key)}
                style={{
                  padding: "7px 12px",
                  fontSize: 12,
                  border: "none",
                  borderLeft: idx === 0 ? "none" : `1px solid ${THEME.border}`,
                  background: view === v.key ? THEME.chipActiveBg : THEME.chipInactiveBg,
                  color: view === v.key ? THEME.chipActiveFg : THEME.fg,
                  cursor: "pointer",
                }}
              >
                {v.label}
              </button>
            ))}
          </div>
          <label style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 12, color: THEME.muted, cursor: "pointer" }}>
            <input type="checkbox" checked={hideVisited} onChange={(e) => setHideVisited(e.target.checked)} />
            Hide visited
          </label>
          <button
            onClick={undo}
            disabled={undoStack.length === 0}
            style={{
              display: "flex",
              alignItems: "center",
              gap: 5,
              padding: "7px 10px",
              fontSize: 12,
              border: `1px solid ${THEME.inputBorder}`,
              background: THEME.panel,
              cursor: undoStack.length ? "pointer" : "default",
              color: undoStack.length ? THEME.fg : THEME.mutedFaint,
            }}
          >
            <Undo2 size={13} />
            Undo
          </button>
        </section>

        {visibleRows.length === 0 && (
          <p style={{ fontSize: 14, color: THEME.mutedLight, padding: "2rem 0", textAlign: "center" }}>
            {countryNames.length === 0 ? "No countries yet." : "No matches."}
          </p>
        )}

        {view === "ranked" && visibleRows.length > 0 && (
          <section>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", borderBottom: `1px solid ${THEME.border}`, paddingBottom: 8, marginBottom: 4 }}>
              <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: THEME.muted }}>Ranking</span>
              <span style={{ fontSize: 11, textTransform: "uppercase", letterSpacing: "0.08em", color: THEME.muted }}>Score</span>
            </div>
            {visibleRows.map((row, i) => renderRow(row, i))}
          </section>
        )}

        {view === "continent" && visibleRows.length > 0 && (
          <section>
            {Object.keys(continentGroups)
              .sort()
              .map((cont) => (
                <div key={cont} style={{ marginBottom: 24 }}>
                  <h2 style={{ fontFamily: "Georgia, serif", fontSize: 15, textTransform: "uppercase", letterSpacing: "0.06em", borderBottom: `1px solid ${THEME.border}`, paddingBottom: 6, marginBottom: 4 }}>
                    {cont}
                  </h2>
                  {continentGroups[cont].map((row, i) => renderRow(row, i))}
                </div>
              ))}
          </section>
        )}

        {saveError && (
          <footer style={{ marginTop: "2rem", fontSize: 11, color: THEME.mutedFaint, textAlign: "center" }}>
            Could not save — your changes may not persist.
          </footer>
        )}
      </div>

      {toast && (
        <div
          style={{
            position: "fixed",
            bottom: 24,
            left: "50%",
            transform: "translateX(-50%)",
            background: THEME.toastBg,
            color: THEME.toastFg,
            padding: "8px 16px",
            fontSize: 13,
            borderRadius: 2,
          }}
        >
          {toast}
        </div>
      )}

      {lightbox && (
        <div
          onClick={closeLightbox}
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(0,0,0,0.82)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            zIndex: 1000,
            padding: 24,
          }}
        >
          <div onClick={(e) => e.stopPropagation()} style={{ maxWidth: 640, width: "100%", textAlign: "center" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
              <span style={{ color: "#fff", fontSize: 13, fontFamily: "monospace" }}>{lightbox.title}</span>
              <button
                onClick={closeLightbox}
                aria-label="Close"
                style={{ border: "none", background: "none", color: "#fff", cursor: "pointer", padding: 4 }}
              >
                <X size={20} />
              </button>
            </div>
            <div
              style={{
                position: "relative",
                background: "#000",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                minHeight: 200,
              }}
            >
              <img
                src={lightbox.url}
                alt={lightbox.caption || lightbox.title}
                style={{ maxWidth: "100%", maxHeight: "70vh", display: "block" }}
                onError={(e) => {
                  e.target.style.display = "none";
                }}
              />
            </div>
            {lightbox.caption && (
              <div style={{ color: "#ddd", fontSize: 13, marginTop: 8, fontFamily: "Georgia, serif" }}>
                {lightbox.caption}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BucketList />);
</script>
</body>
</html>
